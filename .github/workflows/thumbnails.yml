name: Refresh card thumbnails

# Timed off the last ten publishes of each daily site, in UTC, not off their crons -
# the scheduler runs late and the crons lie:
#   One Story      19:26 - 19:51
#   The Aftertimes 20:36 - 20:45
#   Photocopy      20:57 - 21:03, BUT three of ten landed at 22:54
# GITHUB STARTS THESE LATE, EVERY TIME. Measured over nine scheduled runs, a job set for
# 21:37 actually started between 21:53 and 21:59, so 16 to 22 minutes late, and once past
# 21:57. That delay is the whole reason this moved: at 21:37 the cards only went live
# around 21:55 to 22:01, which is 07:55 to 08:01 in Sydney, and Charlie checks at 07:50.
# 21:05 plus the delay lands them about 07:25 to 07:35 Sydney time.
#
# 21:05 is close to the earliest that can work. Photocopy itself publishes at 20:57 to
# 21:03, so shooting sooner would catch yesterday's frame - the floor is set by the site,
# not by us. The second run at 23:23 still picks up Photocopy's 22:54 tail.
# The catch-up is nearly free: the shooter leaves visually-identical shots alone, so on a
# normal night it commits nothing.
# Odd minutes on purpose: GitHub's scheduler drops on-the-hour jobs.
on:
  schedule:
    #
    # THE CATCH-UP MUST LAND BEFORE CHARLIE LOOKS, which is 07:55 AEST / 21:55 UTC.
    # On 26/08/2026 GitHub dropped the 21:05 run entirely. The catch-up at 23:23 UTC
    # is 09:23 AEST - an hour and a half after he had already seen stale cards and
    # reported them. The content jobs it photographs were moved earlier the same day
    # for the same reason; this one has to clear their new backup at 21:05 and still
    # beat 21:55, which 21:30 does with ~16-22 minutes of scheduler lateness.
    - cron: "05 21 * * *"      # 21:05 UTC / 07:05 AEST - daily, the three that change
    - cron: "30 21 * * *"      # 21:30 UTC / 07:30 AEST - catch-up that he can actually
                               # see, after Photocopy's 21:05 backup has landed
    - cron: "23 23 * * *"      # 23:23 UTC / 09:23 AEST - third line, after the fact
    - cron: "43 21 * * 1"      # Mondays - all nine, in case a site was redesigned
  workflow_dispatch:
    inputs:
      target:
        description: "daily, weekly, or a single slug"
        required: false
        default: weekly

jobs:
  shoot:
    runs-on: ubuntu-latest
    # A hang fails fast instead of burning the Actions budget. On 19/08/2026 three
    # dispatches sat on `playwright install` for 25m, 12m and 1h26m before being
    # cancelled by hand - roughly two hours of a 2,000-minute monthly cap, for nothing.
    # A full weekly shoot of every site runs in about two minutes.
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        timeout-minutes: 8
        run: |
          pip install --quiet playwright pillow
          playwright install --with-deps chromium

      - name: Pick the target
        id: target
        run: |
          if [ -n "${{ inputs.target }}" ]; then
            echo "value=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "43 21 * * 1" ]; then
            echo "value=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "value=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Shoot
        run: python tools/shoot_thumbnails.py ${{ steps.target.outputs.value }}

      - name: Commit anything that actually changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          # The script leaves visually-identical shots alone, so an empty diff
          # here is the normal outcome on a quiet week - not a failure.
          if git diff --cached --quiet; then
            echo "No thumbnail changed."
            exit 0
          fi
          git commit -m "Refresh card thumbnails (${{ steps.target.outputs.value }})"
          # This repo takes pushes from several places, so something landing on main
          # between the checkout and here is routine. It is NOT trivially rebasable
          # though, which the previous version assumed: two sessions shooting the
          # same card change the same binary on both sides, git stops on the
          # conflict, and every retry then tried to pull with unmerged files and
          # could never succeed. Seen on 20/08/2026.
          #
          # Thumbnails are GENERATED, so a conflict has a right answer: the shot
          # this run just took. reset --soft keeps our files and replays them as
          # one commit on top of whatever landed, with no merge to resolve.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push attempt $attempt lost a race - replaying onto main"
            git fetch origin main || true
            # --mixed, NOT --soft. `reset --soft` moves HEAD and leaves the INDEX
            # holding this run's entire checked-out tree, so the follow-up commit
            # replays every file as it stood at checkout - silently REVERTING
            # anything anyone else pushed in between. On 26/08/2026 this run
            # undid an estate-wide analytics change across seven files and a card
            # description from another session, in a commit titled "Refresh card
            # thumbnails". --mixed resets the index to origin/main and leaves the
            # working tree alone, so `git add assets` stages the new shots and
            # nothing else.
            git reset --mixed origin/main
            git add assets
            if git diff --cached --quiet; then
              echo "someone else shot the same thing - nothing left to push."
              exit 0
            fi
            git commit -m "Refresh card thumbnails (${{ steps.target.outputs.value }})"
            sleep 3
          done
          echo "::error::could not push the thumbnails after 3 attempts"
          exit 1
