name: Rebuild Crosscheck

# Crosscheck joins Shortfall's accounting scores to Consensus Drift's estimate gaps,
# and adds DCF Studio's ranking on top. All three move on their own schedules, so a
# page built by hand is a page that is quietly wrong within a week.
#
# THE RELAY SLOT, 18:40 UTC / 04:40 AEST. This page generates nothing - it copies what
# three other sites published - so it belongs in the same slot as the hub's Ghostwriters
# pull, after the generate slot at 18:00 and before the photograph slot at 19:10.
#
# The first version of this file ran at 22:20 UTC, which is 08:20 AEST: twenty-five
# minutes AFTER Charlie opens the site at 07:55. Every morning he would have been
# reading the previous day's build while a fresh one ran behind him. Every cron on this
# estate has to be written down in AEST as well as UTC for exactly that reason.
#
# On DCF Studio: this build takes whatever valuations.json is currently published and
# does not wait for it. That repo is PRIVATE, so the heartbeat Worker's token, which is
# scoped public_repo, cannot dispatch to it - it runs on GitHub's own scheduler, which
# is measured 3-7 hours late for this account, so there is no arrival time to sequence
# against. The DCF column is a slowly-moving ranking rather than a daily figure, so
# reading a copy up to a day old costs nothing; pretending the two are sequenced would
# be the error.
on:
  schedule:
    - cron: "40 18 * * *"
  workflow_dispatch:
  # Fired by the heartbeat Worker (site-stats/heartbeat) from OUTSIDE GitHub Actions.
  # On 26/08/2026 GitHub's scheduler went down and took every cron on the estate with
  # it, catch-ups included, and it has since been measured running 3-7 hours late for
  # this account. A backup sharing a failure domain with the thing it backs up is not
  # a backup.
  repository_dispatch:
    types: [heartbeat-crosscheck]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install jinja2

      # Runs the unit tests BEFORE the build, because the two parsers read files other
      # repositories publish and neither controls their shape. A silent format change
      # upstream would still produce a page here, just a wrong one, and the tests are
      # the only thing that would notice.
      - run: python -m pytest crosscheck/test_build.py -q

      # Refuses to write at all if either source, or the join itself, drops below half
      # of what it published last run. A join fails silently: forty rows is a
      # working-looking page.
      - run: python crosscheck/build.py

      - name: Commit only if the numbers actually moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Explicit pathspecs. Several sessions push to this repo and routinely leave
          # work in the tree; a bare `git add -A` in a bot job is how an unrelated
          # change ends up inside a commit titled "crosscheck".
          git add crosscheck/index.html crosscheck/tickers.json crosscheck/counts.json
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "crosscheck: $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push attempt $attempt lost a race - replaying onto main"
            git fetch origin main
            # --mixed, NOT --soft. `reset --soft` leaves the INDEX holding this run's
            # whole checked-out tree, so the replay commit rewrites every tracked file
            # back to how it stood when the job started, silently reverting anything
            # pushed in between. The thumbnail workflow did exactly that on 26/08/2026
            # and undid an estate-wide analytics change inside a commit titled
            # "Refresh card thumbnails".
            git reset --mixed origin/main
            git add crosscheck/index.html crosscheck/tickers.json crosscheck/counts.json
            git diff --staged --quiet && exit 0
            git commit -m "crosscheck: $(date -u +%Y-%m-%d)"
            sleep 3
          done
          echo "::error::could not push after 3 attempts"
          exit 1
