name: Pull Ghostwriters

# Ghostwriters generates its essays in charlie-tren/dystopianist and renders them to
# docs/ there, but the live site is charlietrenorden.com/ghostwriters/ - a folder in
# THIS repo, because Pages will not serve that one. Something has to carry the pages
# across, and doing it from this side means no cross-repo token exists anywhere: this
# workflow's own GITHUB_TOKEN can push here, and a public source repo needs no
# credential to read.
#
# The alternative was a fine-grained PAT stored in dystopianist. This is the same
# result with one fewer secret to hold, rotate and leak.
#
# Timed after the generator's 20:19 cron plus GitHub's habitual 15-25 minute lateness
# (see thumbnails.yml for the measurements). If it runs before the essay lands it
# copies yesterday's pages, sees no diff, and does nothing - so being early is free.

on:
  schedule:
    - cron: "53 21 * * *"
  workflow_dispatch:
  # Fired by the heartbeat Worker (site-stats/heartbeat) at 20:30 UTC, from
  # OUTSIDE GitHub Actions. On 26/08/2026 GitHub's scheduler went down and took
  # every cron on the estate with it, including the catch-ups; a backup that
  # shares a failure domain with the thing it backs up is not a backup.
  repository_dispatch:
    types: [heartbeat-ghostwriters]

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Clone the generator
        id: clone
        run: |
          if git clone --depth 1 https://github.com/charlie-tren/dystopianist.git gen 2>/dev/null; then
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ok=no" >> "$GITHUB_OUTPUT"
            echo "::warning::could not clone charlie-tren/dystopianist - it is still \
            private, so nothing can be pulled. Either make it public or give its own \
            workflow a HUB_TOKEN and let it push here instead."
          fi

      - name: Copy the rendered pages in
        if: steps.clone.outputs.ok == 'yes'
        run: |
          test -f gen/docs/index.html || { echo "::error::gen/docs looks wrong"; exit 1; }
          rm -rf ghostwriters
          cp -r gen/docs ghostwriters
          rm -rf gen

      - name: Commit
        if: steps.clone.outputs.ok == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ghostwriters
          if git diff --cached --quiet; then
            echo "already up to date"
            exit 0
          fi
          git commit -m "ghostwriters: $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push attempt $attempt lost a race - replaying onto main"
            git fetch origin main
            # --mixed, NOT --soft. `reset --soft` moves HEAD and leaves the INDEX
            # holding this run's entire checked-out tree, so the replay commit
            # rewrites every tracked file back to how it stood when the job
            # started - silently REVERTING anything anyone pushed in between.
            # That is not hypothetical: on 26/08/2026 the thumbnail workflow did
            # exactly this and undid an estate-wide analytics change across seven
            # files plus a card description, inside a commit titled "Refresh card
            # thumbnails". That copy was fixed the same day and THIS one was
            # missed, which is why it is worth saying twice.
            # --mixed resets the index to origin/main and leaves the working tree
            # alone, so the `git add` below stages only this job's own output.
            git reset --mixed origin/main
            git add ghostwriters
            git diff --cached --quiet && exit 0
            git commit -m "ghostwriters: $(date -u +%Y-%m-%d)"
            sleep 3
          done
          echo "::error::could not push after 3 attempts"
          exit 1
