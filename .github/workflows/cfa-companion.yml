name: Validate the CFA Companion question bank

on:
  push:
    paths:
      - "cfa-companion/data/**"
      - "cfa-companion/tools/validate.py"
      - "cfa-companion/bank.js"
      - ".github/workflows/cfa-companion.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the bank against the schema and the exam's stem conventions
        working-directory: cfa-companion
        run: python tools/validate.py
      - name: Check bank.js was rebuilt from the JSON it was generated from
        working-directory: cfa-companion
        run: python tools/build_bank.py --check
