name: Refresh research prices

# The page states a current price and a return since each call, so it has to be rebuilt
# or it is quietly wrong. 21:50 UTC on weekdays is after the US close (20:00 or 21:00
# depending on daylight saving) and well after the ASX close at 06:00, so one run picks
# up both. Odd minute on purpose: GitHub's scheduler drops on-the-hour jobs.
on:
  schedule:
    - cron: "50 21 * * 1-5"
  workflow_dispatch:
  # Fired by the heartbeat Worker (site-stats/heartbeat) at 20:30 UTC, from
  # OUTSIDE GitHub Actions. Added 29/08/2026 once GitHub's scheduler was measured
  # running 3-7 hours late for this account every night: these prices appear on a
  # live page next to a Buy or Hold call, so arriving mid-afternoon is visible.
  # The Worker skips this one at weekends, matching the 1-5 cron above.
  repository_dispatch:
    types: [heartbeat-prices]

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install --quiet yfinance jinja2 pytest

      # Before any quote is fetched. This is the only code on the hub that can be
      # silently wrong: it divides a live quote by the price printed in a report and
      # publishes the result as a percentage return next to a Buy or a Hold. The guard
      # below was verified by hand once; these keep it true, along with the return
      # maths, the sign, the cached-quote fallback and the rating colours.
      - run: python -m pytest research -q

      # build.py exits non-zero if a name has no price at all, old or new, so a total
      # data failure fails the run rather than publishing a page with a blank return.
      - run: python research/build.py

      - name: Commit if the numbers moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/index.html research/prices.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Research prices: $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
