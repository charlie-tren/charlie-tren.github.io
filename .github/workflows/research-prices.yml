name: Refresh research prices

# The page states a current price and a return since each call, so it has to be rebuilt
# or it is quietly wrong. 21:50 UTC on weekdays is after the US close (20:00 or 21:00
# depending on daylight saving) and well after the ASX close at 06:00, so one run picks
# up both. Odd minute on purpose: GitHub's scheduler drops on-the-hour jobs.
on:
  schedule:
    - cron: "50 21 * * 1-5"
  workflow_dispatch:

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install --quiet yfinance jinja2

      # build.py exits non-zero if a name has no price at all, old or new, so a total
      # data failure fails the run rather than publishing a page with a blank return.
      - run: python research/build.py

      - name: Commit if the numbers moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/index.html research/prices.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Research prices: $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
