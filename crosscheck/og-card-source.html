<!doctype html>
<html><head><meta charset="utf-8">
<meta name="robots" content="noindex">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #0f1319;
    color: #e6e9ee;
    font-family: ui-sans-serif, system-ui, sans-serif;
    padding: 76px 160px 68px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }
  .eyebrow {
    font-size: 19px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #82a8ca;
  }
  h1 {
    margin-top: 20px;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 96px;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.02;
  }
  .lede {
    margin-top: 28px;
    margin-bottom: 92px;
    max-width: 880px;
    color: #8a94a3;
    font-size: 30px;
    line-height: 1.38;
  }
  .foot {
    position: absolute;
    left: 160px;
    right: 160px;
    bottom: 68px;
    padding-top: 28px;
    border-top: 1px solid #262d38;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-size: 20px;
    color: #5d6675;
  }
  .foot .dom { color: #8a94a3; }
  .mark svg { display: block; width: 84px; height: 84px; }
</style></head>
<body>
  <div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#131a24"/>
  <path d="M7.5 16.8 L13 22.3" fill="none" stroke="#82a8ca" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M13 22.3 L24.5 9.2" fill="none" stroke="#d9a441" stroke-width="4.4" stroke-linecap="round"/>
</svg></div>
  <h1>Crosscheck</h1>
  <p class="lede">S&amp;P 500 and ASX 200 companies ranked on quality, revisions, valuation and momentum, at weights you set.</p>
  <div class="foot"><span class="dom">charlietrenorden.com/crosscheck</span><span>Charlie Trenorden</span></div>
</body></html>
