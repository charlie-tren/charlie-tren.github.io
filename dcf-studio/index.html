<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DCF Studio</title>
<link rel="canonical" href="https://dcf.charlietrenorden.com/">
<meta http-equiv="refresh" content="0; url=https://dcf.charlietrenorden.com/">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192">
<style>
  html { color-scheme: dark light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #0f1319; color: #8a94a3;
         font: 400 17px/1.6 "Iowan Old Style", Palatino, Georgia, serif; }
  a { color: #82a8ca; }
  @media (prefers-color-scheme: light) { body { background: #eef0f3; color: #565d68; } a { color: #3a5f80; } }
</style>
</head>
<body>
  <p>Taking you to DCF Studio - <a href="https://dcf.charlietrenorden.com/">continue</a> if nothing happens.</p>
  <script>
    // Carry the query string across. A shared DCF Studio link holds the whole
    // model in its query - scenario, horizon, every driver override - so
    // redirecting to the bare homepage silently discards the model someone was
    // sent. The path cannot be recovered here (GitHub Pages 404s before this
    // page runs), so /dcf-studio/BHP.AX is still a dead link; deep links should
    // use dcf.charlietrenorden.com directly.
    location.replace("https://dcf.charlietrenorden.com/" + location.search);
  </script>
</body>
</html>
