<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Foreign Property Screener favicons, round 3</title>
<style>
 body{margin:0;padding:26px 30px;background:#fbfbfa;color:#1a1c1f;
      font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
 h1{font:600 17px/1.2 Georgia,serif;margin:0 0 4px}
 p.note{margin:0 0 20px;color:#767d86;font-size:12.5px}
 .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 18px}
 .cell{border:1px solid #e2e5e9;border-radius:8px;padding:12px;background:#fff}
 .sizes{display:flex;align-items:flex-end;gap:12px;margin-bottom:8px}
 .sizes .s64{width:64px;height:64px}.sizes .s32{width:32px;height:32px}.sizes .s16{width:16px;height:16px}
 .tab{display:flex;align-items:center;gap:6px;background:#eceff2;border-radius:6px 6px 0 0;
      padding:5px 9px;font-size:11.5px;color:#5a6068;margin-top:9px}
 .tab svg{width:16px;height:16px;flex:none}
 .lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#767d86;margin-bottom:9px}
 .num{font-weight:700;color:#1a1c1f}
</style></head><body>
<h1>Foreign Property Screener favicons, round 3</h1>
<p class="note">Twelve more houses. Nothing repeated from rounds 1 or 2. Solid shapes and one accent each, because the tab row is the only test that counts.</p>
<div class="grid" id="g"></div>
<script>
const BLUE="#2f6fb2", RUST="#b4553f", SAND="#c98a3f", INK="#1a1c1f", PAPER="#fbfbfa", GREY="#4a5058";
const HOUSE = "M16 5 L27 14 L27 27 L5 27 L5 14 Z";
const icons = [
 ["25. House, keyhole cut", `<rect width="32" height="32" rx="6" fill="${INK}"/>
   <path d="${HOUSE}" fill="${BLUE}"/>
   <circle cx="16" cy="18" r="3.1" fill="${INK}"/>
   <path d="M14.2 20.5 L17.8 20.5 L18.8 27 L13.2 27 Z" fill="${INK}"/>`],

 ["26. House and chimney", `<rect width="32" height="32" rx="6" fill="${INK}"/>
   <rect x="20" y="6" width="4.5" height="7" fill="${SAND}"/>
   <path d="${HOUSE}" fill="${BLUE}"/>`],

 ["27. House, heavy outline", `<rect width="32" height="32" rx="6" fill="${INK}"/>
   <path d="M5 15 L16 6 L27 15 L27 26 L5 26 Z" fill="none" stroke="${BLUE}"
         stroke-width="3.4" stroke-linejoin="round"/>`],

 ["28. House in a circle", `<rect width="32" height="32" rx="6" fill="${INK}"/>
   <circle cx="16" cy="16" r="12" fill="${BLUE}"/>
   <path d="M16 8 L24 15 L24 24 L8 24 L8 15 Z" fill="${PAPER}"/>`],

 ["29. Terrace of three", `<rect width="32" height="32" rx="6" fill="${INK}"/>
   <path d="M6 16 L10.5 11 L15 16 L15 26 L6 26 Z" fill="${GREY}"/>
   <path d="M12.5 15 L17.5 9.5 L22.5 15 L22.5 26 L12.5 26 Z" fill="${BLUE}"/>
   <path d="M20 17 L24 12.5 L28 17 L28 26 L20 26 Z" fill="${RUST}"/>`],

 ["30. Apartment block", `<rect width="32" height="32" rx="6" fill="${INK}"/>
   <rect x="7" y="6" width="18" height="21" rx="1.5" fill="${BLUE}"/>
   <rect x="10.5" y="10" width="4" height="4" fill="${INK}"/>
   <rect x="17.5" y="10" width="4" height="4" fill="${INK}"/>
   <rect x="10.5" y="17" width="4" height="4" fill="${INK}"/>
   <rect x="17.5" y="17" width="4" height="4" fill="${SAND}"/>`],

 ["31. House, half filled", `<rect width="32" height="32" rx="6" fill="${INK}"/>
   <path d="${HOUSE}" fill="#2b3a49"/>
   <path d="M5 19 L27 19 L27 27 L5 27 Z" fill="${BLUE}"/>`],

 ["32. House, bite taken", `<rect width="32" height="32" rx="6" fill="${INK}"/>
   <path d="${HOUSE}" fill="${BLUE}"/>
   <circle cx="6" cy="27" r="6" fill="${INK}"/>`],

 ["33. House on a horizon", `<rect width="32" height="32" rx="6" fill="${INK}"/>
   <path d="M2 22 L30 22" stroke="${GREY}" stroke-width="3" stroke-linecap="round"/>
   <path d="M16 6 L25 13.5 L25 22 L7 22 L7 13.5 Z" fill="${BLUE}"/>`],

 ["34. House, far side of a curve", `<rect width="32" height="32" rx="6" fill="${INK}"/>
   <path d="M1 29 q15 -11 30 0" fill="none" stroke="${SAND}" stroke-width="3.2"/>
   <path d="M16 4 L25 11.5 L25 21 L7 21 L7 11.5 Z" fill="${BLUE}"/>`],

 ["35. Big house, small house", `<rect width="32" height="32" rx="6" fill="${INK}"/>
   <path d="M11 8 L21 16 L21 27 L1 27 L1 16 Z" fill="${BLUE}"/>
   <path d="M25 14 L31 19 L31 27 L19 27 L19 19 Z" fill="${GREY}"/>`],

 ["36. Roof, deep overhang", `<rect width="32" height="32" rx="6" fill="${INK}"/>
   <path d="M2 17 L16 5 L30 17 Z" fill="${BLUE}"/>
   <rect x="9" y="19" width="14" height="8" fill="${PAPER}"/>
   <rect x="14" y="22" width="4" height="5" fill="${INK}"/>`],
];
const g = document.getElementById('g');
icons.forEach(([name, body]) => {
  const svg = s => `<svg class="s${s}" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
  const d = document.createElement('div');
  d.className = 'cell';
  d.innerHTML = `<div class="lbl"><span class="num">${name.split('.')[0]}</span>.${name.split('.').slice(1).join('.')}</div>
    <div class="sizes">${svg(64)}${svg(32)}${svg(16)}</div>
    <div class="tab">${svg(16)}<span>Foreign Property Screener</span></div>`;
  g.appendChild(d);
});
</script></body></html>
