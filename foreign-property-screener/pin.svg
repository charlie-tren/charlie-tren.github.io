<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A map pin with the ground knocked out of its head. Drawn as one solid
       silhouette with a single hole: at 16px, where one unit is half a pixel,
       anything with a second colour or an outline turns to mush, and the pin
       outline is the shape people already read as "a place on a map". The hole
       is the tile colour rather than white so the mark works on either theme. -->
  <rect width="32" height="32" rx="6" fill="#1a1c1f"/>
  <path d="M16 3 C21 3 25 7 25 12 C25 18.5 16 29 16 29 C16 29 7 18.5 7 12 C7 7 11 3 16 3 Z" fill="#2f6fb2"/>
  <circle cx="16" cy="11.5" r="4" fill="#1a1c1f"/>
</svg>
