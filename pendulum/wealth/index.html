<body class="loading">
<header class="wrap">
  <nav class="topnav">
    <a href="../">Who governs</a>
    <a class="home" href="https://charlietrenorden.com/"><span class="back" aria-hidden="true">&larr;</span>&nbsp;<span class="lbl-full">Other projects</span><span class="lbl-short">Projects</span></a>
  </nav>
  <h1>
    <svg class="mark coins" viewBox="0 8 58 48" aria-hidden="true" focusable="false">
      <g class="stack s-bronze" fill="var(--coin-bronze)">
        <ellipse cx="13" cy="50" rx="6.4" ry="2.5"/><ellipse cx="13" cy="45" rx="6.4" ry="2.5"/>
      </g>
      <g class="stack s-silver" fill="var(--coin-silver)">
        <ellipse cx="29" cy="50" rx="6.4" ry="2.5"/><ellipse cx="29" cy="45" rx="6.4" ry="2.5"/>
        <ellipse cx="29" cy="40" rx="6.4" ry="2.5"/>
      </g>
      <g class="stack s-gold" fill="var(--coin-gold)">
        <ellipse cx="45" cy="50" rx="6.4" ry="2.5"/><ellipse cx="45" cy="45" rx="6.4" ry="2.5"/>
        <ellipse cx="45" cy="40" rx="6.4" ry="2.5"/><ellipse cx="45" cy="35" rx="6.4" ry="2.5"/>
        <ellipse cx="45" cy="30" rx="6.4" ry="2.5"/><ellipse cx="45" cy="25" rx="6.4" ry="2.5"/>
        <ellipse cx="45" cy="20" rx="6.4" ry="2.5"/><ellipse cx="45" cy="15" rx="6.4" ry="2.5"/>
        <ellipse cx="45" cy="10" rx="6.4" ry="2.5"/>
      </g>
    </svg>Inequality</h1>
  <p class="standfirst">
    Who owned what, from dug-up houses in 9200 BC to national accounts today.
  </p>
</header>

<main class="wrap">
  <section class="controls" aria-label="Chart controls">
    <div class="control">
      <label for="metric-sel">Measure</label>
      <select id="metric-sel">
        <option value="gini">Wealth Gini</option>
        <option value="top10">Share held by the richest tenth</option>
        <option value="top1">Share held by the richest hundredth</option>
      </select>
    </div>
    <div class="control">
      <label for="country-sel">Country</label>
      <select id="country-sel"></select>
      <span class="hint" id="country-hint"></span>
    </div>
  </section>

  <section class="panel">
    <h2 id="eras-title"></h2>
    <p class="sub" id="eras-blurb"></p>
    <div class="legend" id="legend-eras"></div>
    <figure class="chart">
      <svg id="eras" role="img"></svg>
      <div class="readout" id="eras-readout" hidden></div>
    </figure>
    <p class="caption" id="eras-caption"></p>
  </section>

  <section class="panel">
    <h2>What Each Layer Measures</h2>
    <p class="sub">
      Four kinds of evidence. They barely overlap, so none of them can check
      the others.
    </p>
    <dl id="layers" class="layer-list"></dl>
  </section>

  <section class="panel">
    <h2>Sources</h2>
    <ul id="sources" class="sources"></ul>
  </section>
</main>

<footer class="wrap">
  <p class="fine">
