<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><style>
  /* The hub's share card. Render at a 2400x1260 viewport and screenshot to og-card.png.
     The page's own tokens and face (12/10/2026 redesign). */
  @font-face{font-family:"Fredoka";src:url("fonts/fredoka-latin.woff2") format("woff2");font-weight:300 700}
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{width:2400px;height:1260px;overflow:hidden;background:#0b0c10;color:#eef0f6;
       font:400 18px/1.6 "Fredoka",ui-rounded,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .card{width:1200px;height:630px;transform:scale(2);transform-origin:top left;padding:72px 80px;display:flex;
        flex-direction:row;align-items:center;justify-content:flex-start;gap:88px;position:relative}
  .mark{flex:none;filter:drop-shadow(0 0 44px rgba(167,139,250,.28))}
  .eyebrow{font:600 26px/1 "Fredoka",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#a78bfa;margin:0 0 24px}
  .name{font:600 96px/1.02 "Fredoka",sans-serif;letter-spacing:-.015em;margin:0}
  .domain{font:500 36px/1 "Fredoka",sans-serif;color:#a2a7b6;margin:30px 0 0}
</style></head><body><div class="card"><svg class="mark" width="250" height="250" viewBox="0 0 100 100"><path d="M72.5 37 A26 26 0 1 0 72.5 63" fill="none" stroke="#a78bfa" stroke-width="13" stroke-linecap="round"/><circle cx="50" cy="50" r="6.5" fill="#a78bfa"/></svg>
  <div><p class="eyebrow">Sydney &middot; Financial Markets</p>
    <h1 class="name">Charlie<br>Trenorden</h1>
    <p class="domain">charlietrenorden.com</p></div>
</div></body></html>
