<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Worst Case Scenario share card</title>
<!-- The 1200x630 card that shows when the link is sent to WhatsApp. Rendered
     dark, because every image asset on this estate is: a light rectangle in a
     dark chat thread reads as a page from somewhere else.

     Built from the site's own tokens rather than a second palette, so the card
     and the page it opens agree. Shot with:
       node tools/shoot_og.mjs   (or any 1200x630 screenshot of this file)
     and saved to assets/wcs-og.png. -->
<style>
  @import url("https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&display=swap");
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0f1319; --ink:#e6e9ee; --soft:#8a94a3; --faint:#5d6675;
    --rule:#262d38; --accent:#82a8ca; --raised:#161c24; --grid:#1b212b;
  }
  html,body{width:1200px;height:630px}
  body{
    background:var(--bg); color:var(--ink);
    font:400 18px/1.5 ui-sans-serif,system-ui,sans-serif;
    display:flex; flex-direction:column; justify-content:center;
    padding:64px 72px; position:relative; overflow:hidden;
  }
  /* Three cards fanned behind the title: the game in one glance, and the only
     thing on the card that is not type. */
  .fan{position:absolute; right:64px; top:50%; transform:translateY(-50%);
       width:470px; height:420px}
  .fan i{position:absolute; display:block; width:230px; height:300px;
         border:1px solid var(--rule); border-radius:16px; background:var(--raised);
         top:50%; left:50%; margin:-150px 0 0 -115px}
  .fan i:nth-child(1){transform:rotate(-13deg) translate(-88px,10px)}
  .fan i:nth-child(2){transform:rotate(-1deg) translate(0,-14px);
                      border-color:var(--accent)}
  .fan i:nth-child(3){transform:rotate(12deg) translate(88px,10px)}
  .fan b{position:absolute; left:50%; top:50%; margin:-150px 0 0 -115px;
         width:230px; height:300px; display:block;
         transform:rotate(-1deg) translate(0,-14px);
         padding:22px; font:400 20px/1.35 ui-sans-serif,system-ui,sans-serif;
         color:var(--ink)}
  .fan b span{display:block; color:var(--faint);
              font:600 11px/1 ui-sans-serif,system-ui,sans-serif;
              letter-spacing:.16em; text-transform:uppercase; margin-bottom:14px}
  .copy{max-width:620px; position:relative; z-index:2}
  .kicker{color:var(--faint); font:600 14px/1 ui-sans-serif,system-ui,sans-serif;
          letter-spacing:.2em; text-transform:uppercase}
  h1{font:600 78px/1.02 Spectral,"Iowan Old Style","Palatino Linotype",Palatino,
     Georgia,serif; letter-spacing:-.02em; margin:22px 0 0}
  .sub{color:var(--soft); font-size:24px; line-height:1.45; margin-top:22px;
       max-width:560px}
  .rule{height:1px; background:var(--rule); margin:34px 0 0; width:190px}
  .foot{color:var(--faint); font:400 17px/1 ui-sans-serif,system-ui,sans-serif;
        margin-top:22px}
</style></head>
<body>
  <div class="fan">
    <i></i><i></i><i></i>
    <b><span>The situation</span>Your work Christmas party is at a trampoline park.</b>
  </div>
  <div class="copy">
    <p class="kicker">A party game</p>
    <h1>Worst Case<br>Scenario</h1>
    <p class="sub">Everybody plays their worst card. The room picks the best of a bad lot. Fewest points wins.</p>
    <div class="rule"></div>
    <p class="foot">charlietrenorden.com/worst-case-scenario</p>
  </div>
</body></html>
