<body>
<header class="wrap">
  <div class="topnav">
    <h1 class="masthead">
    <svg class="mark" viewBox="0 0 64 74" aria-hidden="true" focusable="false">
      <clipPath id="scanclip"><rect x="0" y="-76" width="64" height="76"/></clipPath>
      <path class="pin-base" d="M32 6 C42 6 50 14 50 24 C50 37 32 58 32 58 C32 58 14 37 14 24 C14 14 22 6 32 6 Z"/>
      <circle class="pin-hole" cx="32" cy="23" r="7"/>
      <g clip-path="url(#scanclip)">
        <path class="pin-lit" d="M32 6 C42 6 50 14 50 24 C50 37 32 58 32 58 C32 58 14 37 14 24 C14 14 22 6 32 6 Z"/>
        <circle class="pin-hole" cx="32" cy="23" r="7"/>
      </g>
      <line class="scanline" x1="2" y1="0" x2="62" y2="0"/>
    </svg>Property Atlas</h1>
    <button id="theme" type="button" class="theme" aria-pressed="false">
      <span class="theme-dot" aria-hidden="true"></span><span id="theme-label">Dark</span>
    </button>
    <a class="home" href="https://charlietrenorden.com/"><span class="back" aria-hidden="true">&larr;</span>&nbsp;Other projects</a>
  </div>
  <p class="tagline">Residential property data for foreign buyers</p>
</header>

<main class="wrap">

  <section class="panel" id="filters-panel">
    <div class="filters" id="filters" aria-label="Filters">
      <div class="control">
        <label for="f-ease">Ease of investing<button type="button" class="info" id="ease-info"
          aria-expanded="false" aria-controls="ease-help"
          aria-label="What goes into the ease score">i</button></label>
        <div class="row"><input type="range" id="f-ease" min="0" max="100" step="1" value="0"><output id="f-ease-out"></output></div>
      </div>
      <div class="control">
        <label for="f-yield">Net yield</label>
        <div class="row"><input type="range" id="f-yield" min="0" max="8" step="0.1" value="0"><output id="f-yield-out"></output></div>
      </div>
      <div class="control">
        <label for="f-price">Entry price</label>
        <div class="row"><input type="range" id="f-price" min="75000" max="650000" step="5000" value="75000"><output id="f-price-out"></output></div>
      </div>
      <div class="control">
        <label for="f-own">Foreign ownership</label>
        <select id="f-own">
          <option value="">Any</option>
          <option value="3">Foreigners, no restrictions</option>
          <option value="2">Foreigners, with conditions</option>
        </select>
      </div>
      <div class="control">
        <label for="f-visa">Residency from buying</label>
        <select id="f-visa">
          <option value="">Any</option>
          <option value="3">Straight from buying</option>
          <option value="2">Some investor route</option>
        </select>
      </div>
      <div class="control">
        <label for="f-repat">Getting money out</label>
        <select id="f-repat">
          <option value="">Any</option>
          <option value="3">Free</option>
          <option value="2">Free or on registration</option>
        </select>
      </div>
      <div class="control">
        <label for="map-metric">Shade the map by</label>
        <select id="map-metric"></select>
      </div>
    </div>
    <p class="ease-help" id="ease-help" hidden></p>
    <p class="filter-count" id="count"></p>
  </section>

  <section class="panel" id="map-panel">
    <figure class="chart">
      <svg id="map" role="img" aria-label="World map with the thirty-four markets shaded by the selected factor"></svg>
      <div class="readout" id="map-readout" hidden></div>
    </figure>
    <div class="scale" id="map-scale"></div>
  </section>

  <section class="panel" id="table-panel">
    <div class="table-wrap" id="table-wrap">
    <div class="table-scroll" id="table-scroll">
      <table id="grid">
        <thead><tr id="grid-head"></tr></thead>
        <tbody id="grid-body"></tbody>
      </table>
    </div>
    </div>
  </section>

  <section class="panel sources">
    <h2>Sources</h2>
    <table class="src">
      <thead><tr><th scope="col">Measure</th><th scope="col">Source</th><th scope="col">As at</th><th scope="col">Caveat</th></tr></thead>
      <tbody id="sources"></tbody>
    </table>
  </section>

</main>


<script src="app.js"></script>
</body>
</html>
