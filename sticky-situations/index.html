<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worst Case Scenario</title>
<meta name="description" content="Everybody plays their worst card. The room picks the best of a bad lot. Fewest points wins.">
<meta property="og:type" content="website">
<meta property="og:title" content="Worst Case Scenario">
<meta property="og:description" content="Everybody plays their worst card. The room picks the best of a bad lot. Fewest points wins.">
<meta property="og:url" content="https://charlietrenorden.com/sticky-situations/">
<meta property="og:image" content="https://charlietrenorden.com/assets/og-card.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192">
<script>
  /* set theme before paint to avoid a flash - same key as the hub */
  (function () {
    try {
      var saved = localStorage.getItem("theme");
      var dark = saved ? saved === "dark"
        : !(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
  })();
</script>
<link rel="stylesheet" href="/assets/room.css">
<link rel="stylesheet" href="/assets/sticky.css">
<script>/* Analytics, gated. Two kinds of visitor are not an audience: anyone who has opted out with ?nostats=1, and automation - navigator.webdriver is the one signal true for Playwright, Puppeteer and Selenium alike. Inline and dependency-free on purpose: served from the Worker, a bad deploy there would stop analytics on every site. See site-stats/beacon. */
(function(){try{var X="ct.nostats",C="ct_nostats",D=";path=/;domain=.charlietrenorden.com",q=location.search,out=false;if(q.indexOf("nostats=1")>-1){try{localStorage.setItem(X,"1")}catch(e){}document.cookie=C+"=1"+D+";max-age=63072000;samesite=lax";}if(q.indexOf("nostats=0")>-1){try{localStorage.removeItem(X)}catch(e){}document.cookie=C+"="+D+";max-age=0";}try{out=!!localStorage.getItem(X)}catch(e){}if(!out)out=document.cookie.indexOf(C+"=1")>-1;if(out||navigator.webdriver)return;var d=document,s;s=d.createElement("script");s.defer=true;s.src="https://static.cloudflareinsights.com/beacon.min.js";s.setAttribute("data-cf-beacon",'\x7b"token": "32b821209b5441a08df42ccf61c9e6c2"\x7d');d.head.appendChild(s);s=d.createElement("script");s.defer=true;s.src="https://beacon.charlietrenorden.com/b.js";d.head.appendChild(s);}catch(e){}})();</script>
</head>
<body>
<div class="page">
  <div class="bar">
    <a class="home" href="/"><span class="back">&larr;</span>&nbsp;Other projects</a>
    <button class="toggle" id="themeBtn" type="button" aria-label="Toggle light and dark theme"><span class="dot"></span><span id="themeLbl">Dark</span></button>
  </div>

  <section class="lobby" id="lobby">
    <h2 id="lobbyTitle">Create a room</h2>
    <p class="lede-s" id="lobbyLede">Everybody plays their worst card. The room picks the best of a bad lot. Fewest points wins.</p>

    <label class="field"><span>Your name</span>
      <input id="name" type="text" maxlength="24" autocomplete="given-name" placeholder="Charlie"></label>

    <!-- Your badge. It is how people find you on the leaderboard while it is
         moving, which a name in 13px type does not do at a glance. -->
    <div class="field"><span>Your badge</span>
      <div class="picks" id="picks" role="radiogroup" aria-label="Choose your badge"></div>
    </div>

    <!-- Arriving from an invite link, only one of these two makes sense, so the
         other is hidden rather than offered and ignored. -->
    <div id="createBlock">
      <div class="btnrow"><button class="btn block" id="startBtn" type="button">Create a room</button></div>
      <p class="or">Have a code?</p>
      <div class="joinrow">
        <!-- inputmode, not type=number: a number input brings spinners and strips
             leading zeros, and "0421" is a valid code. -->
        <input id="joincode" type="text" maxlength="4" inputmode="numeric" autocomplete="off"
               spellcheck="false" placeholder="Room code" aria-label="Room code">
        <button class="btn ghost" id="joinBtn" type="button">Join</button>
      </div>
    </div>

    <div id="joinBlock" hidden>
      <div class="btnrow"><button class="btn block" id="joinBtn2" type="button">Join room</button></div>
      <p class="or">Not the room you wanted?</p>
      <div class="btnrow"><button class="btn ghost" id="startBtn2" type="button">Create my own</button></div>
    </div>

    <p class="err" id="err"></p>
  </section>

  <section id="room" hidden>
    <div class="roomtop">
      <span class="roomcode" id="code">----</span>
      <button class="btn ghost" id="copyBtn" type="button">Copy invite link</button>
      <span id="progress"></span>
    </div>

    <div class="roomgrid">
    <div class="roommain">

    <!-- Before the game starts. The host is the only one who can begin, so
         everybody else is told what is being waited for rather than shown a
         button that would be refused. -->
    <div id="preGame">
      <!-- The theme picker. Everybody sees it; only the host can change it. -->
      <h3 class="sect">The Game</h3>
      <div class="themes" id="themes"></div>
      <!-- Bots. Also how you try the game on your own: one person and two
           bots is a legal table. -->
      <div class="botrow" id="botRow" hidden>
        <span class="botlbl" id="botLbl">Bots</span>
        <button class="btn ghost small" id="botLess" type="button" aria-label="Fewer bots">&minus;</button>
        <span class="botn" id="botN">0</span>
        <button class="btn ghost small" id="botMore" type="button" aria-label="More bots">+</button>
      </div>
      <p class="waiting" id="waiting"></p>
      <div class="hostrow" id="startRow" hidden>
        <button class="btn" id="beginBtn" type="button">Start the game</button>
      </div>
    </div>

    <div id="play" hidden>
      <!-- What the room is being asked for. The single most important line on
           the screen: it decides whether you wanted to play your worst card or
           your best one, and it is the thing players missed. -->
      <!-- The premise: what game this is, before the prompt that varies. -->
      <p class="premise" id="premise"></p>
      <p class="ask" id="ask"></p>
      <p class="modifier" id="modifier" hidden></p>
      <p class="sitlabel" id="sitlabel"></p>
      <p class="statement" id="situation"></p>

      <!-- What you played, kept on screen. The card leaves your hand when you
           play it, and with nothing in its place you could not remember what you
           had put in while the room talked about it. -->
      <p class="yours" id="yours" hidden></p>

      <!-- Your hand. Only ever sent to you. -->
      <div id="handWrap" hidden>
        <div class="handhead">
          <h3 class="sect">Your Hand</h3>
          <!-- One swap for the whole game, so the control says what it costs
               rather than only what it does. Hidden once it is spent: a dead
               button sitting there is worse than no button. -->
          <button class="btn ghost small" id="swapBtn" type="button" hidden>Swap a card</button>
        </div>
        <div class="cards hand" id="hand"></div>
        <p class="tally" id="handNote"></p>
      </div>

      <!-- The table. Anonymous until the round has scored. -->
      <div id="tableWrap" hidden>
        <h3 class="sect" id="tableHead">On The Table</h3>
        <div class="cards table" id="table"></div>
      </div>

      <div class="hostrow" id="hostrow" hidden>
        <button class="btn" id="advanceBtn" type="button">Open the vote</button>
      </div>
      <!-- Only when the round is genuinely stuck on somebody. Never on screen at
           the same time as the button above: that one lives in discussing and
           scored, this one in playing and voting. -->
      <div class="hostrow" id="carryrow" hidden>
        <button class="btn ghost" id="carryBtn" type="button">Carry on without them</button>
      </div>
      <p class="tally" id="tally"></p>

      <!-- Watching, because you arrived after the deal. The cards come from the
           ones nobody was dealt, so this costs the table nothing. -->
      <div class="hostrow" id="joinRow" hidden>
        <button class="btn" id="joinInBtn" type="button">Deal me in</button>
      </div>
    </div>

    </div><!-- /roommain -->

    <!-- Everyone, always, sorted by blame, and it MOVES when somebody overtakes.
         Names and scores are not secret, and a scoreboard nobody can see is not
         a scoreboard. This replaced a row of small chips: the chips could not
         show a position changing, which is the whole point. -->
    <aside class="board" id="board">
      <h3 class="sect" id="boardHead">In The Room</h3>
      <ol class="bl" id="blist"></ol>
      <p class="blnote" id="blnote"></p>
    </aside>
    </div><!-- /roomgrid -->

    <div id="over" hidden>
      <h2 class="reshead">Final Blame</h2>
      <p class="lede-s">Fewest wins.</p>
      <ol class="simlist" id="final"></ol>
      <div class="hostrow" id="againRow" hidden>
        <button class="btn" id="againBtn" type="button">Play again</button>
      </div>
    </div>
  </section>
</div>

<script src="/assets/sticky-situations.js"></script>
</body>
</html>
