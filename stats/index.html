<head>

<title>Site stats</title>
<link rel="canonical" href="https://stats.charlietrenorden.com/">
<meta http-equiv="refresh" content="0; url=https://stats.charlietrenorden.com/">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192">
<style>
  html { color-scheme: dark light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #0f1319; color: #8a94a3;
         font: 400 17px/1.6 "Iowan Old Style", Palatino, Georgia, serif; }
  a { color: #82a8ca; }
  @media (prefers-color-scheme: light) { body { background: #eef0f3; color: #565d68; } a { color: #3a5f80; } }
</style>
</head>
<body>
  <!-- A short URL, kept for muscle memory - the real host is
       stats.charlietrenorden.com, which the footer links to directly. A subpath on the
       apex cannot serve Pages content itself: the apex is GitHub Pages on a DNS-only
       record, and proxying it would break the GitHub certificate.
       The destination is gated, so this being public gives nothing away: anyone without
       the key lands on a 404. -->
  <p>Taking you to the stats - <a href="https://stats.charlietrenorden.com/">continue</a> if nothing happens.</p>
  <script>location.replace("https://stats.charlietrenorden.com/");</script>
</body>
