<!doctype html>
<html><head><meta charset="utf-8">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #0f1319;
    color: #e6e9ee;
    font-family: ui-sans-serif, system-ui, sans-serif;

    font-size: 30px;
    line-height: 1.38;
  }
  .foot {
    position: absolute;
    left: 160px;
    right: 160px;
    bottom: 68px;
    padding-top: 28px;
    border-top: 1px solid #262d38;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-size: 20px;
    color: #8a94a3;
  }
  .foot .dom { color: #8a94a3; }
  .mark svg { display: block; width: 84px; height: 84px; }
  .lede.solo { margin-top: 40px; color: #e6e9ee; font-size: 46px; line-height: 1.3; letter-spacing: -0.01em; }
