<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookmark</title>
<meta name="description" content="Seven questions about what you want from a book, and one recommendation a month. 331 books, picked by hand, no accounts.">
<meta property="og:type" content="website">
<meta property="og:title" content="Bookmark">
<meta property="og:description" content="Seven questions about what you want from a book, and one recommendation a month.">
<meta property="og:url" content="https://charlietrenorden.com/bookmark/">
<link rel="canonical" href="https://charlietrenorden.com/bookmark/">
<meta property="og:image" content="https://charlietrenorden.com/assets/og-card.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/bookmark/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/bookmark/favicon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/bookmark/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<script>/* Ahead of the stylesheet on purpose: reading the choice after first paint
   flashes the other theme for a frame. No stored choice means follow the system. */
(function(){try{var t=localStorage.getItem("bookmark.theme");
if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<style>
/* LIGHT MODE IS ITS OWN DESIGN, not the dark one with the values swapped.
   The first version kept the bookcase near-black in both themes, on the argument
   that cloth spines need a dark ground - and on screen it was a black slab
   dropped into a cream page with no relation to anything around it. What the
   spines actually need is CONTRAST, not darkness: the cloth colours are already
   deep navy, oxblood and forest, so a warm mid-tone case reads as a bookcase and
   a black one reads as a hole. Everything that was a dark fill with near-black
   text on it - the pressed buttons, the buy link - now goes through --on-accent,
   because #211d16 on #9a6b12 is two dark browns arguing. */
:root{
  --paper:#1a1916; --paper2:#232019; --ink:#efe9dc; --ink-soft:#9a9384;
  --line:#33302a; --line2:#474135; --accent:#d9a441;
  --case:#141310; --wood:#4b3a28; --case-in:rgba(0,0,0,.55);
  --on-accent:#211d16; --lift:rgba(0,0,0,.55); --sheen:rgba(255,255,255,.13);
  color-scheme:dark;
  /* TWO SERIFS, ON PURPOSE. Young Serif is a display face and ships in one
     weight, so a 600 heading would be a synthesised bold - it takes the wordmark,
     the book title and the section headings, all at 400. Spectral keeps the
     running text and the spines: the descriptions now run to about 170 characters
     and Young Serif's weight is hard going at that length, and at 13px vertical
     on a spine it clogs. */
  --font-display:'Young Serif',Georgia,'Times New Roman',serif;
  --font-serif:'Spectral',Georgia,'Times New Roman',serif;
  --font-sans:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --paper:#faf7f0; --paper2:#f1ece0; --ink:#231f1a; --ink-soft:#6b6357;
    --line:#e3dbcb; --line2:#cec2ab; --accent:#8a5d0e;
    /* A warm mid-tone case: deep spines still read as books against it, and it
       belongs to the same room as the page. */
    --case:#c3b199; --wood:#8d7050; --case-in:rgba(90,66,38,.42);
    --on-accent:#fdf9f0; --lift:rgba(74,56,32,.30); --sheen:rgba(255,255,255,.30);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --paper:#faf7f0; --paper2:#f1ece0; --ink:#231f1a; --ink-soft:#6b6357;
  --line:#e3dbcb; --line2:#cec2ab; --accent:#8a5d0e;
  /* A warm mid-tone case: deep spines still read as books against it, and it
     belongs to the same room as the page. */
  --case:#c3b199; --wood:#8d7050; --case-in:rgba(90,66,38,.42);
  --on-accent:#fdf9f0; --lift:rgba(74,56,32,.30); --sheen:rgba(255,255,255,.30);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-sans);
  color:var(--ink); background:var(--paper); min-height:100vh; font-size:15px;
}
.serif{font-family:var(--font-serif)}
a{color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:0 24px}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:22px 0 0}
.brand{display:inline-flex;align-items:center;gap:.5rem;
  font-family:var(--font-display);font-size:36px;font-weight:400;
  letter-spacing:-.015em;line-height:1}
.brand .dot{color:var(--accent)}
/* A PAGE TURNS. Four paths: two fixed leaves, a gutter, and one loose leaf that
   sweeps from the right block across to the left. The sweep is scaleX hinged on
   the gutter, which is what a page turning is when you see it head on, and each
   phase carries its own easing inside the keyframes - one curve across the whole
   cycle reads as a wipe rather than a page. Same trap as the Pendulum cradle:
   transform-origin is written in px and transform-box must be view-box, or each
   path measures from its OWN bounding box and the four stop agreeing.

   THE REDUCED-MOTION BRANCH IS NOT A DEAD END. Windows animations are off on
   Charlie's machine, so every hover animation on this estate is invisible to
   him - which is how the first version of this mark shipped looking inert to the
   one person reviewing it. Under reduced motion the leaf still turns up on the
   left and the gutter still thickens; it just gets there by opacity rather than
   by moving. */
.brand .mark{width:.9em;height:.9em;flex:0 0 auto;overflow:visible;
  transform-box:view-box}
.brand .pg,.brand .turn{fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linejoin:round;transform-box:view-box;transform-origin:12px 13px;
  transition:transform .3s cubic-bezier(.22,.7,.25,1)}
/* Filled, so the turning leaf covers the block it is passing over instead of
   showing through it. */
.brand .turn{fill:var(--paper);opacity:0}
.brand .gut{stroke:var(--accent);stroke-width:1.8;transition:stroke-width .25s}

.bar:hover .brand .pg{transform:rotate(-6deg)}
.bar:hover .brand .pg.r{transform:rotate(6deg)}
.bar:hover .brand .gut{stroke-width:2.6}
.bar:hover .brand .turn{animation:leaf 1s cubic-bezier(.4,0,.6,1) both}

@keyframes leaf{
  0%   {opacity:0; transform:rotate(6deg) scaleX(1)}
  8%   {opacity:1; transform:rotate(6deg) scaleX(1)}
  /* lifting off the right block, accelerating */
  46%  {opacity:1; transform:rotate(2deg) scaleX(.10);
        animation-timing-function:cubic-bezier(.5,0,.9,.4)}
  /* edge-on at the gutter, the fastest point of the turn */
  54%  {opacity:1; transform:rotate(-2deg) scaleX(-.10);
        animation-timing-function:cubic-bezier(.1,.6,.5,1)}
  /* settling onto the left block, decelerating */
  92%  {opacity:1; transform:rotate(-6deg) scaleX(-1)}
  100% {opacity:0; transform:rotate(-6deg) scaleX(-1)}
}

@media (prefers-reduced-motion: reduce){
  .brand .pg,.brand .turn,.brand .gut{transition:none}
  .bar:hover .brand .pg,.bar:hover .brand .pg.r{transform:none}
  .bar:hover .brand .turn{animation:none;opacity:1;
    transform:rotate(-6deg) scaleX(-1)}
  .bar:hover .brand .gut{stroke-width:2.6}
}
/* THE ESTATE'S OWN BAR, not a local invention. Both of these were hand-rolled
   here first - a right-pointing arrow after the words, and a bare text button for
   the theme - and neither matched anything else on the site. The house pattern is
   in assets/room.css and shipped on Worst Case Scenario: a muted uppercase
   back-link with an accent left arrow, and a pill toggle carrying an accent dot. */
.barright{display:flex;align-items:center;gap:1.1rem}
.home{font:500 13px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-soft);text-decoration:none;white-space:nowrap;
  display:inline-flex;align-items:center;transition:color .2s}
.home:hover{color:var(--accent)}
.home .back{color:var(--accent);font-size:14px}
.toggle{appearance:none;-webkit-appearance:none;cursor:pointer;background:transparent;
  color:var(--ink-soft);border:1px solid var(--line2);border-radius:999px;
  padding:.45rem .85rem;font:500 12px/1 var(--font-sans);letter-spacing:.04em;
  display:inline-flex;align-items:center;gap:.5rem;transition:border-color .2s,color .2s}
.toggle:hover{color:var(--ink);border-color:var(--accent)}
.toggle .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.lede{font-family:var(--font-serif);font-size:17px;color:var(--ink-soft);
      margin:24px 0 26px;max-width:46ch;line-height:1.5}

/* the shelf */
.shelfbox{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;
  background:var(--case);border-radius:4px;padding:16px 12px 0;
  box-shadow:inset 0 16px 26px -18px var(--case-in), inset 0 0 0 1px var(--sheen);
  scroll-behavior:smooth}
.shelfbox::-webkit-scrollbar{display:none}
.shelf{display:flex;align-items:flex-end;gap:4px;min-height:210px;
       border-bottom:9px solid var(--wood);padding:0 2px;width:max-content;min-width:100%}

/* A SPINE IS FIVE PARTS, not a coloured rectangle: cloth, a gilt rule at head and
   tail, a label panel the title sits in, a bumped top edge, and a weave. Flat
   colour plus vertical text read as a swatch with words on it - which is the same
   failure the pale-ground palettes had, arriving from the other direction. */
.spine{position:relative;border-radius:3px 3px 0 0;cursor:pointer;flex:0 0 auto;
  background:
    /* the weave: fine vertical threads, set per book by --weave */
    repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px var(--weave,3px)),
    /* cloth is darker at the hinge and catches light along the face */
    linear-gradient(90deg, rgba(0,0,0,.42) 0 3px, rgba(255,255,255,.10) 4px 7px,
                    transparent 20%, transparent 78%, rgba(0,0,0,.34) 100%),
    var(--cloth,#3d5a45);
  border:1px solid rgba(0,0,0,.5);
  box-shadow:inset 0 2px 0 var(--sheen), 0 6px 12px -8px var(--lift);
  transition:transform .16s cubic-bezier(.2,.7,.3,1), box-shadow .16s;
  transform-origin:bottom center; will-change:transform}
/* head and tail bands, in the book's own gilt */
.spine::before,.spine::after{content:"";position:absolute;left:5%;right:5%;height:0;
  border-top:1px solid var(--gilt,rgba(226,199,140,.62));
  border-bottom:1px solid var(--gilt,rgba(226,199,140,.30));
  padding-top:3px;pointer-events:none}
.spine::before{top:13px}
.spine::after{bottom:15px}
.spine .lab{position:absolute;inset:26px 3px 30px;border-radius:2px;
  background:rgba(0,0,0,.20);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.spine .t{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;
  color:#f6f1e4;font-family:var(--font-serif);font-size:13px;letter-spacing:.02em;
  text-shadow:0 1px 2px rgba(0,0,0,.55);max-height:100%;overflow:hidden;text-overflow:ellipsis}
/* the author's initial, foil-blocked at the tail the way a real spine carries the
   publisher's mark */
.spine .in{position:absolute;left:0;right:0;bottom:4px;text-align:center;
  font-family:'Spectral',Georgia,serif;font-size:9px;letter-spacing:.06em;
  color:var(--gilt,rgba(226,199,140,.62));pointer-events:none}
.spine:hover{transform:translateY(-9px)}
.spine[aria-current="true"]{transform:translateY(-15px);
  box-shadow:inset 0 2px 0 var(--sheen), 0 0 0 2px var(--accent), 0 14px 22px -12px var(--lift)}
@media (prefers-reduced-motion: reduce){
  .spine{transition:none}
  .shelfbox{scroll-behavior:auto}
}
.shelfnote{display:flex;justify-content:space-between;gap:12px;align-items:baseline;
  font-size:13px;color:var(--ink-soft);margin:12px 0 0}
.shelfnote button{font:inherit;font-size:13px;color:var(--ink-soft);background:none;border:none;
  cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0}
.shelfnote button:hover{color:var(--ink)}
.shelfnote button[hidden]{display:none}

/* the pulled book */
.pulled{display:grid;grid-template-columns:170px 1fr;gap:32px;align-items:start;margin-top:34px}
/* Same cloth, same weave, same foil as that book's spine - once the spines carry
   a treatment, a flat panel beside them stops reading as the same object. */
.cover{position:relative;height:250px;border-radius:2px 6px 6px 2px;
  border-left:11px solid rgba(0,0,0,.42);
  display:flex;flex-direction:column;justify-content:space-between;padding:22px 18px;
  font-family:var(--font-serif);color:#f6f1e4;overflow:hidden;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px var(--weave,3px)),
    linear-gradient(115deg, rgba(255,255,255,.09), transparent 42%),
    var(--cloth,#3d5a45);
  box-shadow:0 22px 40px -26px var(--lift)}
.cover::before,.cover::after{content:"";position:absolute;left:16px;right:16px;height:0;
  border-top:1px solid var(--gilt,rgba(226,199,140,.62));
  border-bottom:1px solid var(--gilt,rgba(226,199,140,.28));padding-top:4px}
.cover::before{top:12px}
.cover::after{bottom:14px}
.cover .ct{font-size:19px;line-height:1.15;font-weight:600}
.cover .ca{font-size:12px;opacity:.85}
.month{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
.title{font-family:var(--font-display);font-size:35px;line-height:1.12;font-weight:400;
  letter-spacing:-.012em;margin:12px 0 5px}
.byline{color:var(--ink-soft);margin:0 0 18px}
.why{font-family:var(--font-serif);font-size:19px;line-height:1.55;margin:0 0 8px;max-width:46ch}
/* CC BY-SA is not a formality: the text is Wikipedia's, so every book that took
   a line links the page it came from, and the footer names the licence. */
.whysrc{display:inline-block;font-size:12px;color:var(--ink-soft);text-decoration:none;
  border-bottom:1px solid var(--line2);margin-bottom:20px}
.whysrc:hover{color:var(--ink)}
.whysrc[hidden]{display:none}
.match{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.mchip{font-size:12px;color:var(--ink-soft);background:var(--paper2);border:1px solid var(--line);
       border-radius:20px;padding:4px 11px}
/* ONE STYLE. Two of them read as a code the reader has to crack: the gold ones
   were "these match your answers", which nothing on the page said and which the
   reader can work out by looking at the answers directly. The row describes the
   book, and that is all it has to do. */
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:18px}
.buy{font-size:14px;font-weight:600;text-decoration:none;color:var(--on-accent);background:var(--accent);
     border:1px solid var(--accent);border-radius:8px;padding:10px 17px}
.buy:hover{filter:brightness(1.08)}
.alt{font-size:14px;text-decoration:none;color:var(--ink);background:none;border:1px solid var(--line2);
     border-radius:8px;padding:10px 15px}
.alt:hover{background:var(--paper2)}
.swap{margin-left:auto;font-size:13px;color:var(--ink-soft);background:none;border:none;
      font-family:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.swap:hover{color:var(--ink)}
.pulled.empty .cover,.pulled.empty .actions{display:none}

/* questions */
h2.sec{font-family:var(--font-display);font-size:21px;font-weight:400;letter-spacing:-.005em;margin:46px 0 20px}
h2.sec.first{margin-top:26px}
.q{border-top:1px solid var(--line);padding:18px 0}
.q:first-of-type{border-top:none}
.qlabel{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);
        font-weight:600;margin-bottom:11px}
.qhint{margin-left:10px;font-size:12px;letter-spacing:0;text-transform:none;
  font-weight:400;color:var(--ink-faint,var(--ink-soft));opacity:.75}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{font:inherit;font-size:14px;color:var(--ink);background:var(--paper2);border:1px solid var(--line2);
     border-radius:8px;padding:9px 14px;cursor:pointer;transition:.12s}
.opt:hover{background:var(--line)}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
  color:var(--on-accent);font-weight:600}
.opt.chip[aria-pressed="true"]{background:color-mix(in srgb, var(--accent) 22%, var(--paper2));
  border-color:var(--accent);color:var(--ink)}
/* Excluded has to look like a DIFFERENT answer, not a fainter version of wanted -
   dimming alone reads as disabled. Struck through and desaturated. */
.opt.chip.no{color:var(--ink-soft);border-color:var(--line);background:transparent;
  text-decoration:line-through;text-decoration-thickness:1px;opacity:.75}
.opt.chip.no:hover{opacity:1;color:var(--ink)}

/* SLIDERS for the three ordinal questions. Length, age and effort are points on a
   line, and a row of buttons hid that - "Short / Middling / Long" is one axis
   pretending to be three choices. Fiction-or-not, prose and subject are genuinely
   categorical and stay buttons: a slider between crime and nature means nothing. */
.slider{padding-top:2px}
.slider input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;
  background:none;margin:0;cursor:pointer;display:block}
.slider input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,var(--accent) 0 var(--fill,0%),var(--line2) var(--fill,0%) 100%)}
.slider input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--line2)}
.slider input[type=range]::-moz-range-progress{height:5px;border-radius:3px;background:var(--accent)}
.slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:19px;height:19px;border-radius:50%;background:var(--accent);border:2px solid var(--paper);
  box-shadow:0 1px 4px var(--lift);margin-top:-7px}
.slider input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;
  background:var(--accent);border:2px solid var(--paper);box-shadow:0 1px 4px var(--lift)}
.slider input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:6px;border-radius:4px}
/* No transition on the thumb: a native range thumb is positioned by its VALUE,
   not by a transform, so CSS cannot animate it and a rule here would do nothing
   while looking like it did something. A tick tap is animated in JS instead - see
   glideTo(). */
/* Ticks are labels, not decoration: a slider whose positions are unnamed is a
   guess. The chosen one is the one that goes solid. */
/* Positioned, not space-between. The thumb centre travels from 9.5px to
   width-9.5px, so an evenly-spaced flex row puts "Short" a few percent left of
   the notch it names - close enough to look like a rendering fault rather than a
   choice. --p is the tick's fraction of the axis. */
.ticks{position:relative;height:17px;margin-top:3px}
.ticks span{position:absolute;top:0;font-size:12px;color:var(--ink-soft);line-height:1.25;
  white-space:nowrap;left:calc(9.5px + (100% - 19px) * var(--p));transform:translateX(-50%)}
/* Belt and braces with the timestamp guard: mid-drag the labels are not targets,
   so the cursor crossing them cannot even begin to look like a tap. */
.slider:has(input[data-dragging]) .ticks{pointer-events:none}
.ticks span:first-child{transform:translateX(0)}
.ticks span:last-child{transform:translateX(-100%)}
.ticks span[data-on="1"]{color:var(--ink);font-weight:600}
/* "Any" sits at position zero on Length and Age because it is the absence of a
   preference, not a value on the axis - so the track reads empty until you move. */
.ticks span.any{font-style:italic}
/* books you liked */
.liked{margin-top:30px}
.likedrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* A NATIVE DATALIST CANNOT BE CAPPED. It offered every title on the shelf, which
   was tolerable at 331 and absurd at 955 - the browser drops a list the height of
   the screen over the page. This is the same control with a ceiling on it: at
   most eight matches, and nothing at all until two characters are typed. */
.typeahead{position:relative;flex:1 1 260px;min-width:260px}
.likedin{font:inherit;font-size:14px;color:var(--ink);background:var(--paper2);
  border:1px solid var(--line2);border-radius:8px;padding:10px 13px;width:100%}
.suggest{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 5px);margin:0;
  padding:4px;list-style:none;background:var(--paper2);border:1px solid var(--line2);
  border-radius:8px;box-shadow:0 18px 34px -20px var(--lift);max-height:none}
.suggest[hidden]{display:none}
.suggest li{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px;
  display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.suggest li .sa{color:var(--ink-soft);font-size:12px;flex:0 0 auto}
.suggest li[aria-selected="true"],.suggest li:hover{background:var(--line)}
.suggest .none{color:var(--ink-soft);cursor:default}
.suggest .none:hover{background:none}
.likedin::placeholder{color:var(--ink-soft)}
.import{font:inherit;font-size:14px;color:var(--ink);background:none;border:1px solid var(--line2);
  border-radius:8px;padding:10px 15px;cursor:pointer}
.import:hover{background:var(--paper2)}
.import input{display:none}
.likedlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.lchip{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);
  background:var(--paper2);border:1px solid var(--line2);border-radius:20px;padding:5px 6px 5px 13px}
.lchip button{font:inherit;font-size:15px;line-height:1;color:var(--ink-soft);background:none;
  border:none;cursor:pointer;padding:0 6px}
.lchip button:hover{color:var(--ink)}
.likednote{font-size:13px;color:var(--ink-soft);margin-top:12px}
footer{margin:52px 0 60px;padding-top:18px;border-top:1px solid var(--line);
       font-size:13px;color:var(--ink-soft);line-height:1.6}
@media (max-width:620px){
  .wrap{padding:0 16px}
  .brand{font-size:28px}
  /* Same fix room.css carries: at this width the wordmark, the toggle and two
     words of link will not sit on one line, so the link keeps only its arrow. */
  .barright{gap:.6rem}
  .barright .home{font-size:0;letter-spacing:0}
  .barright .home .back{font-size:16px}

<!-- shelf.js is the facets and blocks, because nothing can draw without them.
     texts.js is the descriptions and defers: 427KB of prose of which the page
     shows one line at a time, and holding first paint for it made no sense at
     1812 books. Both are generated from books.js by tools/build_site_data.py. -->
<script src="shelf.js"></script>
<script src="texts.js" defer></script>
<script>
/* Amazon Associates tag. Empty until there is one; the links work either way. */
var AFFIL_TAG = "";

var SETS = ["britain","america","europe","asia","africa","latam","oceania","mideast"];
var SETNAME = {britain:"Britain and Ireland",america:"North America",europe:"Europe",
  asia:"Asia",africa:"Africa",latam:"Latin America",oceania:"Australasia",
  mideast:"Middle East"};

var TAGS = ["literary","crime","speculative","history","war","politics","markets","science",
            "technology","ideas","nature","travel","memoir","family","art","sport"];
var TAGNAME = {literary:"Literary fiction",crime:"Crime and spies",speculative:"Speculative",
  history:"History",war:"War",politics:"Politics",markets:"Money and markets",science:"Science",
  technology:"Technology",ideas:"Ideas",nature:"Nature",travel:"Travel",memoir:"Memoir",
  family:"Family",art:"Art and music",sport:"Sport"};

var QS = [
  {id:"mood", label:"What do you want it to do", multi:true,
   opts:[["absorb","Absorb me"],["learn","Teach me something"],["unsettle","Unsettle me"],["laugh","Make me laugh"]]},
  {id:"form", label:"Fiction or not", multi:false,
   opts:[["any","Either"],["fic","Fiction"],["non","Nonfiction"]]},
  /* slider:true where the options are POINTS ON A LINE. "Any" holds position zero
     on the two that have it, because no preference is the absence of a value on
     the axis rather than a value in the middle of it. */
  {id:"len", label:"How long", multi:false, slider:true,
   opts:[["any","Any"],["s","Short"],["m","Middling"],["l","Long"]]},
  {id:"era", label:"How old", multi:false, slider:true,
   opts:[["any","Any"],["contemporary","Last 20 years"],["modern","Postwar"],["older","Older"]]},
  {id:"sty", label:"Prose", multi:false,
   opts:[["any","No preference"],["plain","Plain and fast"],["rich","Rich and slow"],["funny","Funny and sharp"]]},
  {id:"dem", label:"How much work", multi:false, slider:true,
   opts:[["1","Easy company"],["2","Some work"],["3","Hard is fine"]]},
  {id:"tags", label:"Subjects", multi:true, chips:true, tri:true,
   opts:TAGS.map(function(t){return [t,TAGNAME[t]];})},
  /* SCORED, NOT FILTERED, and that is the whole point of it. Subject is a hard
     cut, so picking one divides the shelf and a second cut would empty it - which
     is why this question was not worth having until the shelf tripled. Setting
     floats matching books to the top instead. Nothing is ever excluded by it, and
     a book with no recorded setting is not penalised: 452 of 817 are genuinely
     unplaceable - invented worlds, essays, books about ideas - and marking them
     down for it would bury the whole of speculative fiction. */
  {id:"sets", label:"Where it is set", multi:true, chips:true,
   opts:SETS.map(function(t){return [t,SETNAME[t]];})}
];

/* notags is the exclusion list. Kept separate from tags rather than encoded as a
   negative inside it, because the two are asked in opposite directions: tags
   WIDENS the shelf (any match qualifies) and notags NARROWS it (any match
   disqualifies), so a single signed array would have needed unpicking at every
   use anyway. */
var DEFAULTS = {mood:["absorb"],form:"any",len:"any",era:"any",sty:"any",dem:"2",tags:[],notags:[],sets:[]};
var state = JSON.parse(JSON.stringify(DEFAULTS));
var offset = 0;      /* "Read it already", counted in months forward */
var browsing = null; /* a spine the reader pulled out, which is not this month's */

/* Book cloth. Decorative, and deliberately not carrying data: width is the honest
   channel here and it maps to length. */
var CLOTH = ["#2f4858","#7a2e2e","#3d5a45","#6b4f36","#44405e","#7d5b2b","#2b4d4d","#5d3a4a",
             "#43536b","#6a3b2e","#365243","#584a2f"];
var WIDTH = {s:26, m:34, l:44};

function era(b){ return b.y>=2005?"contemporary":(b.y>=1945?"modern":"older"); }
var LENORD = {s:0,m:1,l:2};

/* Books you liked. Per device, in localStorage rather than the URL: the URL is the
   share link and a reading history is not the thing being shared. */
var liked = [];       /* titles, matched to the shelf */
var likedNote = "";   /* what the last Goodreads import actually matched */

function loadLiked(){
  try{
    var raw = localStorage.getItem("bookmark.liked");
    if(raw) liked = JSON.parse(raw).filter(function(t){ return byTitle(t); });
  }catch(e){}
}
function saveLiked(){ try{ localStorage.setItem("bookmark.liked", JSON.stringify(liked)); }catch(e){} }
function byTitle(t){
  return window.SHELF.find(function(b){ return b.t === t; });
}

/* What the liked books have in common, as weights in 0..1. */
function taste(){
  var books = liked.map(byTitle).filter(Boolean);
  if(!books.length) return null;
  var tg = {}, md = {}, st = {}, dem = 0;
  books.forEach(function(b){
    b.tags.forEach(function(t){ tg[t] = (tg[t]||0) + 1; });
    b.mood.forEach(function(m){ md[m] = (md[m]||0) + 1; });
    st[b.sty] = (st[b.sty]||0) + 1;
    dem += b.dem;
  });
  var n = books.length;
  Object.keys(tg).forEach(function(k){ tg[k] /= n; });
  Object.keys(md).forEach(function(k){ md[k] /= n; });
  Object.keys(st).forEach(function(k){ st[k] /= n; });
  return {tg:tg, md:md, st:st, dem:dem/n, n:n};
}

/* Capped deliberately: the answers above are what the reader actually said, and a
   reading history should tilt the shelf, not overrule it. */
function affinity(b, ta){
  if(!ta) return 0;
  var s = 0;
  b.tags.forEach(function(t){ s += (ta.tg[t]||0) * 3; });
  b.mood.forEach(function(m){ s += (ta.md[m]||0) * 1.5; });
  s += (ta.st[b.sty]||0) * 1.5;
  s -= Math.abs(b.dem - ta.dem) * 0.6;
  return Math.max(-2, Math.min(4, s));
}

/* A HAND-SET FACET IS A CLAIM; A SOFT ONE IS A PRIOR. Books added from prize
   lists carry soft:1 - their title, author, year, length and subject are read
   from Wikipedia and Open Library, but mood, prose and effort are inferred by
   rule from subject and era. Those three are taste, a rule gets them roughly
   right and cannot get them exactly right, so the penalty for missing on one is
   halved. Weighting a guess like a judgement would have buried every hand-set
   book under the ones that merely guessed agreeably. Reward is unchanged: a soft
   facet that MATCHES is still a match. */
function score(b){
  var s = 0, soft = b.soft ? 0.5 : 1;
  if(state.mood.length){ var hits=0; state.mood.forEach(function(m){ if(b.mood.indexOf(m)>-1) hits++; });
    s += hits*3; if(!hits) s -= 3*soft; }
  if(state.len!=="any") s += (b.len===state.len) ? 3 : (Math.abs(LENORD[b.len]-LENORD[state.len])===1 ? -1.5 : -4);
  if(state.era!=="any") s += (era(b)===state.era) ? 3 : -3;
  if(state.sty!=="any") s += (b.sty===state.sty) ? 3 : -1*soft;
  s -= Math.abs(b.dem - Number(state.dem)) * 1.6 * soft;
  if(state.tags.length){ var th=0; state.tags.forEach(function(t){ if(b.tags.indexOf(t)>-1) th++; });
    s += th*2.5; }
  /* Reward only. A miss here means either "set somewhere else" or "not set
     anywhere", and those are different claims that the data cannot tell apart. */
  if(state.sets.length && b.set){
    var sh=0; state.sets.forEach(function(t){ if(b.set.indexOf(t)>-1) sh++; });
    s += sh*3;
  }
  return s;
}

function key(){
  return [state.mood.slice().sort().join("+"),state.form,state.len,state.era,state.sty,state.dem,
          state.tags.slice().sort().join("+"),
          state.notags.slice().sort().join("+"),
          state.sets.slice().sort().join("+")].join("|");
}
/* The shuffle seed includes the reading history; the shareable ?p= does not. */
function seedKey(){
  return key() + "#" + liked.slice().sort().join("+");
}
function hash(str){ var h=2166136261>>>0; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h>>>0; }
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; var t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* Form and subject are FILTERS, the rest are scores. Scoring them instead let a
   novel with no crime in it win a fiction-and-crime answer on its other axes. */
function eligible(){
  return window.SHELF.filter(function(b){
    if(state.form!=="any" && b.f!==state.form) return false;
    if(state.tags.length && !state.tags.some(function(t){ return b.tags.indexOf(t)>-1; })) return false;
    /* ONE excluded subject is enough to drop a book, where one wanted subject is
       enough to keep it. Exclusion is the stronger claim: "no war books" means no
       war books, not fewer of them. */
    if(state.notags.some(function(t){ return b.tags.indexOf(t)>-1; })) return false;
    return true;
  });
}
function shortlist(){
  var pool = eligible().filter(function(b){ return liked.indexOf(b.t) === -1; });
  if(!pool.length) return [];
  var ta = taste();
  var ranked = pool.map(function(b,i){ return {b:b,s:score(b)+affinity(b,ta),i:i}; })
    .sort(function(x,y){ return y.s-x.s || x.i-y.i; });
  var best = ranked[0].s;
  var band = ranked.filter(function(r){ return r.s >= best - 6; });
  if(band.length < 6) band = ranked.slice(0, 6);
  var top = band.slice(0,30).map(function(r){ return r.b; });
  var r = rng(hash(seedKey())), out = top.slice();
  for(var i=out.length-1;i>0;i--){ var j=Math.floor(r()*(i+1)); var t=out[i]; out[i]=out[j]; out[j]=t; }
  return out;
}

/* Says what the shelf actually is. It claimed "picked by hand" while every book
   on it was, and kept claiming it when they were not. */
function shelfFoot(){
  var hand = window.SHELF.filter(function(b){ return !b.soft; }).length;
  if(hand === window.SHELF.length) return hand + " books, picked by hand.";
  return window.SHELF.length + " books: " + hand + " picked by hand, the rest prize winners.";
}

function monthIndex(d){ return d.getFullYear()*12 + d.getMonth(); }
function cloth(b){ return CLOTH[hash(b.t + b.a) % CLOTH.length]; }

var MOODNAME = {absorb:"Absorbing",learn:"Teaches you something",unsettle:"Unsettling",laugh:"Funny"};
var LENNAME = {s:"Short",m:"Middling",l:"Long"};
var ERANAME = {contemporary:"Last twenty years",modern:"Postwar",older:"Older"};
var STYNAME = {plain:"Plain prose",rich:"Rich prose",funny:"Sharp and funny"};
var DEMNAME = {1:"Easy company",2:"Some work",3:"Hard going"};

/* DESCRIBE THE BOOK, then mark what you asked for.
   These used to be emitted only where an answer was non-default, so a first visit
   - which is mood:absorb and "any" everywhere else - printed exactly one chip on
   every book on the shelf: "Absorbing". The chips are the only place the page
   says what a book IS, and they were saying it about the reader instead. */
function matchChips(b){
  var out = [];
  function add(label, on){ if(label) out.push({label:label, on:!!on}); }

  add(b.f === "fic" ? "Fiction" : "Nonfiction", state.form !== "any" && b.f === state.form);
  b.mood.forEach(function(m){ add(MOODNAME[m], state.mood.indexOf(m) > -1); });
  add(LENNAME[b.len], state.len !== "any" && b.len === state.len);
  add(ERANAME[era(b)], state.era !== "any" && era(b) === state.era);
  add(STYNAME[b.sty], state.sty !== "any" && b.sty === state.sty);
  add(DEMNAME[b.dem], String(b.dem) === String(state.dem));
  b.tags.forEach(function(t){ add(TAGNAME[t], state.tags.indexOf(t) > -1); });
  (b.set || []).forEach(function(t){ add(SETNAME[t], state.sets.indexOf(t) > -1); });
  return out;
}

/* The shelf is ordered by author, the ROTATION is the shuffled order, and the two
   are deliberately different: if the spines sat in month order, the book to the
   right of this month's would be next month's, and there would be nothing to come
   back for on the first. */
function surname(a){
  var parts = a.split(" and ")[0].trim().split(/\s+/);
  return parts[parts.length-1];
}
function displayOrder(list){
  return list.slice().sort(function(x,y){
    return surname(x.a).localeCompare(surname(y.a)) || x.t.localeCompare(y.t);
  });
}

/* REBUILD ONLY WHEN THE SHELF ITSELF CHANGED. Every click used to tear down all
   thirty spines and append thirty new ones, then force a scroll, so choosing a
   book made the whole row flicker and jump - the glitch. Selecting is now an
   attribute change on nodes that never left the page, which is also what lets the
   spine animate out of the shelf instead of being replaced mid-transition. */
var shelfSig = null;

function drawShelf(list, currentIdx){
  var shelf = document.getElementById("shelf");
  var sig = list.map(function(b){ return b.t; }).join("");
  var rebuilt = sig !== shelfSig;
  if(rebuilt){
    shelfSig = sig;
    while(shelf.firstChild) shelf.removeChild(shelf.firstChild);
    list.forEach(function(b){ shelf.appendChild(spineEl(b)); });
  }
  var nodes = shelf.children;
  for(var i = 0; i < nodes.length; i++){
    nodes[i].setAttribute("aria-current", i === currentIdx ? "true" : "false");
  }
  return rebuilt;
}

/* Foil comes in two finishes because a shelf where every book is stamped in the
   same gold reads as a set rather than a shelf. */
var FOIL = ["rgba(226,199,140,.68)","rgba(226,199,140,.68)","rgba(226,199,140,.68)",
            "rgba(228,226,220,.60)"];

function spineEl(b){
  var h = hash(b.t + b.a);
  var s = document.createElement("button");
  s.type = "button"; s.className = "spine"; s.setAttribute("role","listitem");
  s.style.setProperty("--cloth", cloth(b));
  s.style.setProperty("--weave", (3 + h % 4) + "px");
  s.style.setProperty("--gilt", FOIL[(h >>> 3) % FOIL.length]);
  s.style.width = WIDTH[b.len] + "px";
  /* tall enough for the title to sit on the spine, which is why length drives
     height rather than a random jitter: a cut-off title reads as a bug. */
  s.style.height = (146 + Math.min(b.t.length, 42) * 2.6 + (h % 4) * 4) + "px";
  var lab = document.createElement("span"); lab.className = "lab";
  var t = document.createElement("span"); t.className = "t"; t.textContent = b.t;
  lab.appendChild(t);
  var ini = document.createElement("span"); ini.className = "in";
  ini.textContent = surname(b.a).charAt(0).toUpperCase();
  s.appendChild(lab); s.appendChild(ini);
  s.setAttribute("aria-label", b.t + " by " + b.a);
  s.addEventListener("click", function(){ pick(b); });
  return s;
}

/* Scroll the shelf box, never the page: on a phone the month's book is often off
   to the right, and a spine nobody can see is not a pick. */
var lastShown = 0;
function centreSpine(force){
  var box = document.querySelector(".shelfbox");
  var el = box.querySelectorAll(".spine")[lastShown];
  if(!el) return;
  /* rects, not offsetLeft: the spines' offsetParent is the page wrapper rather than
     the scroll box, so offset arithmetic is out by the page padding. */
  var br = box.getBoundingClientRect(), cr = el.getBoundingClientRect();
  /* DON'T MOVE A SHELF THAT IS ALREADY SHOWING THE BOOK. Re-centring on every
     render yanked the row sideways when the reader clicked a spine they could
     plainly see, which read as the page fighting them. */
  if(!force && cr.left >= br.left + 8 && cr.right <= br.right - 8) return;
  var want = box.scrollLeft + (cr.left - br.left) - (br.width - cr.width) / 2;
  box.scrollLeft = Math.max(0, want);
}
/* Three times, and it needs all three: after a frame for the spines just appended,
   again once Spectral has loaded because the shelf is 400px wider in the real face
   than in the fallback, and again on resize. */
function scrollSpineIntoView(i, force){
  lastShown = i;
  requestAnimationFrame(function(){ centreSpine(force); });
  if(force && document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){ centreSpine(true); });
  }
}
window.addEventListener("resize", function(){ requestAnimationFrame(function(){ centreSpine(true); }); });

function render(){
  var list = shortlist();
  var d = new Date();
  if(!list.length){ renderEmpty(); return; }
  document.getElementById("pulled").classList.remove("empty");
  var monthIdx = (monthIndex(d) + offset) % list.length;
  var idx = browsing === null ? monthIdx : browsing;
  var b = list[idx];
  var q = encodeURIComponent(b.t + " " + b.a);

  var shown = displayOrder(list);
  var shownIdx = shown.indexOf(b);
  var rebuilt = drawShelf(shown, shownIdx);
  /* Forced only when the row itself changed, so a new shelf still centres its pick
     and a plain selection does not. */
  scrollSpineIntoView(shownIdx, rebuilt);
  document.getElementById("backBtn").hidden = (browsing === null);

  document.getElementById("month").textContent = browsing === null
    ? d.toLocaleString("en-AU",{month:"long"}) + " " + d.getFullYear()
    : "From your shelf";
  document.getElementById("title").textContent = b.t;
  document.getElementById("byline").textContent = b.a + ", " + (b.y<1000 ? b.y + " CE" : b.y);
  /* THE PAGE HAS TO BE RIGHT WITH texts.js ABSENT, not merely late. It defers,
     so on a slow connection the shelf, the questions and this month's pick all
     draw first and the description arrives after - and nothing about WHICH book
     was chosen depends on it. */
  var tx = (window.TEXTS || {})[b.t] || [];
  document.getElementById("whytext").textContent = tx[0] || "";
  var ws = document.getElementById("whysrc");
  ws.hidden = !tx[1];
  if(tx[1]) ws.href = tx[1];
  var cv = document.getElementById("cover"), ch = hash(b.t + b.a);
  cv.style.setProperty("--cloth", cloth(b));
  cv.style.setProperty("--weave", (3 + ch % 4) + "px");
  cv.style.setProperty("--gilt", FOIL[(ch >>> 3) % FOIL.length]);
  document.getElementById("coverT").textContent = b.t;
  document.getElementById("coverA").textContent = b.a;

  var m = document.getElementById("match");
  while(m.firstChild) m.removeChild(m.firstChild);
  matchChips(b).forEach(function(c){
    var el = document.createElement("span");
    el.className = "mchip";
    el.textContent = c.label;
    m.appendChild(el);
  });

  document.getElementById("buyAmz").href =
    "https://www.amazon.com.au/s?k=" + q + (AFFIL_TAG ? "&tag=" + AFFIL_TAG : "");
  document.getElementById("buyBkt").href = "https://www.booktopia.com.au/search?keywords=" + q;
  document.getElementById("findLib").href = "https://search.worldcat.org/search?q=" + q;
  document.getElementById("shelfcount").textContent =
    list.length === 1 ? "One book fits these answers." : list.length + " books fit these answers.";
  document.getElementById("shelffoot").textContent = shelfFoot();
  writeUrl();
}

/* A spine click browses; clicking the one already pulled out puts it back. */
function pick(b){
  var list = shortlist();
  var i = list.indexOf(b);
  var monthIdx = (monthIndex(new Date()) + offset) % list.length;
  browsing = (i === monthIdx || i === browsing) ? null : i;
  render();
}

function renderEmpty(){
  document.getElementById("pulled").classList.add("empty");
  var shelf = document.getElementById("shelf");
  while(shelf.firstChild) shelf.removeChild(shelf.firstChild);
  shelfSig = null;   /* or the next non-empty render sees a matching signature and draws nothing */
  document.getElementById("backBtn").hidden = true;
  document.getElementById("month").textContent = "";
  document.getElementById("title").textContent = "Nothing on the shelf fits";
  document.getElementById("byline").textContent = "";
  document.getElementById("whytext").textContent = state.notags.length
    ? "Too much is excluded. Clear a struck-through subject."
    : "Drop a subject or take fiction back to either.";
  var m = document.getElementById("match");
  while(m.firstChild) m.removeChild(m.firstChild);
  document.getElementById("shelfcount").textContent = "No books fit these answers.";
  document.getElementById("shelffoot").textContent = shelfFoot();
  writeUrl();
}

function build(){
  var host = document.getElementById("questions");
  QS.forEach(function(q){
    var wrap = document.createElement("div"); wrap.className = "q";
    var lab = document.createElement("div"); lab.className = "qlabel"; lab.textContent = q.label;
    /* The third state is the one thing on this page nobody would find by looking.
       A chip that is merely on or off needs no instruction; one that also goes to
       "not this" does. */
    if(q.tri){
      var hint = document.createElement("span");
      hint.className = "qhint"; hint.textContent = "click twice to rule one out";
      lab.appendChild(hint);
    }
    wrap.appendChild(lab);
    wrap.appendChild(q.slider ? buildSlider(q) : buildButtons(q));
    host.appendChild(wrap);
  });
  paint();
}

function buildButtons(q){
  var opts = document.createElement("div"); opts.className = "opts";
  opts.setAttribute("data-q", q.id);
  q.opts.forEach(function(o){
    var btn = document.createElement("button");
    btn.type = "button"; btn.className = "opt" + (q.chips ? " chip" : "");
    btn.textContent = o[1]; btn.setAttribute("data-v", o[0]);
    btn.addEventListener("click", function(){ choose(q, o[0]); });
    opts.appendChild(btn);
  });
  return opts;
}

/* Sub-units per notch. Big enough that a drag reads as continuous, small enough
   that a keyboard arrow still lands somewhere useful. */
var SUB = 40;
/* When the last drag on any slider finished. A click arriving within a few
   frames of that is the tail of the drag, not a new instruction. */
var dragEnded = 0;

/* Walk the thumb to a notch over ~190ms rather than teleporting it. Only for a
   tick tap and a keyboard jump; a drag is already continuous and animating it
   would make the thumb lag the finger. The answer is committed once, at the
   destination, so the shelf is not re-scored on every frame. */
function glideTo(box, q, val){
  var r = box.querySelector("input");
  if(r.dataset.dragging) return;
  var to = q.opts.findIndex(function(o){ return o[0] === val; }) * SUB;
  var from = Number(r.value);
  if(from === to){ choose(q, val); return; }
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    r.value = to; choose(q, val); return;
  }
  var t0 = performance.now(), dur = 190;
  (function step(now){
    var k = Math.min(1, (now - t0) / dur);
    var e = 1 - Math.pow(1 - k, 3);
    r.value = Math.round(from + (to - from) * e);
    box.style.setProperty("--fill", (Number(r.value) / r.max * 100) + "%");
    if(k < 1) requestAnimationFrame(step);
    else { markTicks(box, q, val); choose(q, val); }
  })(t0);
}

function markTicks(box, q, val){
  box.querySelectorAll(".ticks span").forEach(function(t){
    t.setAttribute("data-on", t.getAttribute("data-v") === val ? "1" : "0");
  });
}

function buildSlider(q){
  var box = document.createElement("div"); box.className = "slider";
  box.setAttribute("data-q", q.id);
  var r = document.createElement("input");
  /* SUB-STEPS, NOT NOTCHES. With step=1 over three or four positions the thumb
     teleports and the control feels like three buttons wearing a slider. The
     input now travels in SUB units per notch, so dragging is continuous, and the
     ANSWER is the nearest notch - which is also why choose() only fires when
     that nearest notch actually changes, rather than on every pixel of the drag
     (each call re-scores 331 books). */
  r.type = "range"; r.min = 0; r.max = (q.opts.length - 1) * SUB; r.step = 1;
  r.setAttribute("aria-label", q.label);
  /* The thumb is on a number, but what the reader is choosing is a WORD, so the
     screen reader gets the word. Without this it announces "40 of 200". */
  /* DRAGGING IS FLAGGED, and paint() leaves a flagged slider alone. Committing a
     notch mid-drag calls render(), render() calls paint(), and paint() wrote
     value = notch * SUB - which yanked the thumb back to the notch while the
     finger was still between two. That was the glitch: the control fought the
     drag every time it crossed a boundary. */
  r.addEventListener("input", function(){
    r.dataset.dragging = "1";
    var i = Math.round(Number(r.value) / SUB);
    box.style.setProperty("--fill", (Number(r.value) / r.max * 100) + "%");
    markTicks(box, q, q.opts[i][0]);
    if(q.opts[i][0] !== state[q.id]) choose(q, q.opts[i][0]);
  });
  /* Let go and it settles onto the notch, so the thumb never rests between two
     labels claiming to be neither. */
  r.addEventListener("change", function(){
    if(r.dataset.dragging) dragEnded = Date.now();
    delete r.dataset.dragging;
    r.value = Math.round(Number(r.value) / SUB) * SUB;
    paint();
  });
  /* change does not fire if the drag ends without moving, and a pointer that
     leaves the window never fires it at all. */
  ["pointerup", "pointercancel", "blur"].forEach(function(ev){
    r.addEventListener(ev, function(){
      if(!r.dataset.dragging) return;
      dragEnded = Date.now();
      delete r.dataset.dragging;
      r.value = Math.round(Number(r.value) / SUB) * SUB;
      paint();
    });
  });
  box.appendChild(r);
  var ticks = document.createElement("div"); ticks.className = "ticks";
  q.opts.forEach(function(o){
    var t = document.createElement("span");
    t.textContent = o[1]; t.setAttribute("data-v", o[0]);
    if(o[0] === "any") t.className = "any";
    /* A tick is a label AND a target: on a phone the words are easier to hit than
       a 19px thumb, and someone who reads "Postwar" will try to tap it.
       BUT RELEASING A DRAG OVER A LABEL IS NOT A TAP ON IT. A range input
       captures the pointer, so a drag that ends with the cursor over "Middling"
       still fires that label's click - and the slider you had just placed by hand
       jumped to whatever word you happened to let go over. That is the glitch
       when you drag across the words underneath. */
    t.addEventListener("click", function(){
      if(Date.now() - dragEnded < 250) return;
      glideTo(box, q, o[0]);
    });
    t.style.cursor = "pointer";
    ticks.appendChild(t);
  });
  ticks.querySelectorAll("span").forEach(function(t, i, all){
    t.style.setProperty("--p", (i / (all.length - 1)).toFixed(4));
  });
  box.appendChild(ticks);
  return box;
}

function choose(q, v){
  if(q.tri){
    /* want -> not this -> neither. Readers know their dislikes better than their
       likes, and until now the page could only be told what to include. */
    var yes = state[q.id], no = state.notags;
    var iy = yes.indexOf(v), inn = no.indexOf(v);
    if(iy > -1){ yes.splice(iy,1); no.push(v); }
    else if(inn > -1){ no.splice(inn,1); }
    else { yes.push(v); }
  } else if(q.multi){
    var arr = state[q.id], at = arr.indexOf(v);
    if(at > -1){ arr.splice(at,1); } else { arr.push(v); }
  } else {
    state[q.id] = v;
  }
  offset = 0; browsing = null;
  paint(); render();
}

function paint(){
  document.querySelectorAll(".opts").forEach(function(g){
    var id = g.getAttribute("data-q"), val = state[id];
    g.querySelectorAll(".opt").forEach(function(btn){
      var v = btn.getAttribute("data-v");
      var on = Array.isArray(val) ? val.indexOf(v) > -1 : val === v;
      var off = id === "tags" && state.notags.indexOf(v) > -1;
      btn.setAttribute("aria-pressed", on ? "true" : "false");
      btn.classList.toggle("no", off);
      btn.title = off ? "Excluded. Click to clear."
                : on ? "Wanted. Click to exclude." : "Click to include.";
    });
  });
  document.querySelectorAll(".slider").forEach(function(g){
    var id = g.getAttribute("data-q");
    var q = QS.find(function(x){ return x.id === id; });
    var i = q.opts.findIndex(function(o){ return o[0] === state[id]; });
    if(i < 0) i = 0;
    var r = g.querySelector("input");
    /* Never written mid-drag. The guard used to be "only if the value differs",
       which is exactly the case that arises the moment a drag crosses a notch. */
    var want = i * SUB;
    if(!r.dataset.dragging && Number(r.value) !== want) r.value = want;
    r.setAttribute("aria-valuetext", q.opts[i][1]);
    /* Chrome cannot fill a range track from CSS alone, so the filled fraction is
       handed to the gradient as a variable. Firefox uses ::-moz-range-progress and
       ignores this. */
    g.style.setProperty("--fill", (i / (q.opts.length - 1) * 100) + "%");
    markTicks(g, q, state[id]);
  });
}

/* The URL carries the answers only once they differ from the defaults, so a first
   visit has a clean address and a shared one reproduces the same shelf. */
function writeUrl(){
  var same = JSON.stringify(state) === JSON.stringify(DEFAULTS);
  var url = location.pathname + (same ? "" : "?p=" + encodeURIComponent(key()));
  history.replaceState(null, "", url);
}
function readUrl(){
  var p = new URLSearchParams(location.search).get("p");
  if(!p) return;
  /* 7, 8 or 9. Links shared before exclusions and before setting existed carry
     fewer fields and must keep resolving to the same shelf. */
  var f = p.split("|"); if(f.length < 7 || f.length > 9) return;
  state.mood = f[0] ? f[0].split("+") : [];
  state.form = f[1]; state.len = f[2]; state.era = f[3]; state.sty = f[4]; state.dem = f[5];
  state.tags = f[6] ? f[6].split("+").filter(function(t){ return TAGS.indexOf(t) > -1; }) : [];
  state.notags = f[7] ? f[7].split("+").filter(function(t){ return TAGS.indexOf(t) > -1; }) : [];
  state.sets = f[8] ? f[8].split("+").filter(function(t){ return SETS.indexOf(t) > -1; }) : [];
}

/* ---- light and dark ----
   With no stored choice the page follows the system, so the button has to label
   itself from WHAT IS ON SCREEN rather than from what is stored. A first version
   cycled system -> light -> dark and read "Light" while already showing light,
   where pressing it appeared to do nothing. */
function showingDark(){
  var t = document.documentElement.getAttribute("data-theme");
  if(t) return t === "dark";
  return !window.matchMedia || !window.matchMedia("(prefers-color-scheme: light)").matches;
}
function labelTheme(){
  var next = showingDark() ? "light" : "dark";
  document.getElementById("themeLbl").textContent =
    next.charAt(0).toUpperCase() + next.slice(1);
  document.getElementById("themeBtn")
    .setAttribute("aria-label", "Switch to the " + next + " theme");
}
document.getElementById("themeBtn").addEventListener("click", function(){
  var next = showingDark() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("bookmark.theme", next); }catch(e){}
  labelTheme();
});

/* texts.js CALLS THIS when it finishes, rather than the page guessing when that
   was. A deferred script runs after the document is parsed but the inline app
   script below runs DURING parsing, so the first render always happens before
   the descriptions exist - and a load listener put here to catch up landed
   inside the theme handler and never fired. The data file invoking a hook is the
   only version of this with no ordering to get wrong. */
window.onTexts = function(){ render(); };
/* Someone who never pressed the button is still following the system, so the
   label has to move when the system does. */
if(window.matchMedia){
  window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", labelTheme);
}
labelTheme();

document.getElementById("swapBtn").addEventListener("click", function(){
  offset++; browsing = null; render();
});
document.getElementById("backBtn").addEventListener("click", function(){
  browsing = null; render();
});

/* ---- books you liked: type-ahead, chips, and the Goodreads import ---- */

/* At most this many. Eight fits under the field without covering the shelf. */
var SUGGEST_MAX = 8;
var sugIdx = -1, sugItems = [];

function matches(q){
  q = q.trim().toLowerCase();
  if(q.length < 2) return [];
  var starts = [], contains = [];
  for(var i = 0; i < window.SHELF.length; i++){
    var b = window.SHELF[i];
    if(liked.indexOf(b.t) > -1) continue;
    var t = b.t.toLowerCase();
    /* Prefix matches first: someone typing "the r" means The Road before
       Barbarians at the Gate, even though both contain the string. */
    if(t.indexOf(q) === 0) starts.push(b);
    else if(t.indexOf(q) > -1 || b.a.toLowerCase().indexOf(q) > -1) contains.push(b);
    if(starts.length >= SUGGEST_MAX) break;
  }
  return starts.concat(contains).slice(0, SUGGEST_MAX);
}

function closeSuggest(){
  var ul = document.getElementById("suggest");
  ul.hidden = true; sugIdx = -1; sugItems = [];
  document.getElementById("likeIn").setAttribute("aria-expanded", "false");
}

function drawSuggest(){
  var inp = document.getElementById("likeIn"), ul = document.getElementById("suggest");
  sugItems = matches(inp.value);
  while(ul.firstChild) ul.removeChild(ul.firstChild);
  if(inp.value.trim().length < 2){ closeSuggest(); return; }
  if(!sugItems.length){
    var li = document.createElement("li");
    li.className = "none"; li.textContent = "Not on the shelf";
    ul.appendChild(li);
  }
  sugItems.forEach(function(b, i){
    var li = document.createElement("li");
    li.setAttribute("role", "option");
    li.setAttribute("aria-selected", i === sugIdx ? "true" : "false");
    var t = document.createElement("span"); t.textContent = b.t;
    var a = document.createElement("span"); a.className = "sa"; a.textContent = b.a;
    li.appendChild(t); li.appendChild(a);
    /* mousedown, not click: the input's blur fires first on a click and would
       have closed the list before the handler ran. */
    li.addEventListener("mousedown", function(e){ e.preventDefault(); takeSuggest(i); });
    ul.appendChild(li);
  });
  ul.hidden = false;
  inp.setAttribute("aria-expanded", "true");
}

function takeSuggest(i){
  var b = sugItems[i];
  if(!b) return;
  document.getElementById("likeIn").value = "";
  closeSuggest();
  addLiked(b.t);
}

function drawLiked(){
  var host = document.getElementById("likedList");
  while(host.firstChild) host.removeChild(host.firstChild);
  liked.forEach(function(t){
    var b = byTitle(t); if(!b) return;
    var chip = document.createElement("span"); chip.className = "lchip";
    chip.appendChild(document.createTextNode(b.t + " - " + b.a));
    var x = document.createElement("button");
    x.type = "button"; x.textContent = "×";
    x.setAttribute("aria-label", "Remove " + b.t);
    x.addEventListener("click", function(){
      liked = liked.filter(function(v){ return v !== t; });
      saveLiked(); drawLiked(); render();
    });
    chip.appendChild(x); host.appendChild(chip);
  });
  var note = document.getElementById("likedNote");
  note.textContent = likedNote ? likedNote
    : (liked.length ? liked.length + (liked.length===1 ? " book is" : " books are")
        + " tilting the shelf, and none of them will be recommended back to you."
      : "Add a few and the shelf leans towards what they have in common.");
}

function addLiked(title){
  var b = byTitle(title);
  if(!b || liked.indexOf(b.t) > -1) return false;
  liked.push(b.t); saveLiked();
  likedNote = ""; drawLiked(); render();
  return true;
}

var likeIn = document.getElementById("likeIn");
likeIn.addEventListener("input", function(){ sugIdx = -1; drawSuggest(); });
likeIn.addEventListener("blur", function(){ setTimeout(closeSuggest, 80); });
likeIn.addEventListener("keydown", function(e){
  var ul = document.getElementById("suggest");
  if(!ul.hidden && sugItems.length){
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      /* -1 is "still in the field", and it is a real position in the cycle: down
         from the last item returns you to what you typed rather than wrapping
         straight to the top. */
      sugIdx += (e.key === "ArrowDown" ? 1 : -1);
      if(sugIdx >= sugItems.length) sugIdx = -1;
      if(sugIdx < -1) sugIdx = sugItems.length - 1;
      drawSuggest();
      return;
    }
    if(e.key === "Enter" && sugIdx > -1){ e.preventDefault(); takeSuggest(sugIdx); return; }
  }
  if(e.key === "Escape"){ closeSuggest(); return; }
  /* Typing the whole title and pressing Enter still works, for anyone who knows
     exactly what they want and never looked at the list. */
  if(e.key === "Enter" && addLiked(e.target.value)){ e.target.value = ""; closeSuggest(); }
});

/* Goodreads export. Parsed here in the page: the file never leaves the browser.
   Only rows on the shelf can teach it anything, so the count is reported rather
   than implied - matching 20 of 400 is a different claim from reading the lot. */
function norm(t){
  return t.toLowerCase()
    .replace(/\([^)]*\)/g, " ")
    .replace(/[^a-z0-9]+/g, " ")
    .replace(/^(the|a|an) /, "")
    .trim();
}
function parseCsv(text){
  var rows = [], row = [], cell = "", q = false;
  for(var i=0;i<text.length;i++){
    var c = text[i];
    if(q){
      if(c === '"' && text[i+1] === '"'){ cell += '"'; i++; }
      else if(c === '"'){ q = false; }
      else cell += c;
    } else if(c === '"'){ q = true; }
    else if(c === ","){ row.push(cell); cell = ""; }
    else if(c === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
    else if(c !== "\r"){ cell += c; }
  }
  if(cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function importGoodreads(text){
  var rows = parseCsv(text);
  if(!rows.length) return;
  var head = rows[0].map(function(h){ return h.trim().toLowerCase(); });
  var iT = head.indexOf("title"), iR = head.indexOf("my rating"), iS = head.indexOf("exclusive shelf");
  if(iT < 0){ likedNote = "That file has no Title column, so it is probably not a Goodreads export."; drawLiked(); return; }
  /* Goodreads titles carry subtitles and series names that this shelf does not, so
     both forms are indexed and both are tried. Exact after normalising, never fuzzy:
     a wrong match silently teaches it the wrong taste. */
  var index = {};
  window.SHELF.forEach(function(b){
    index[norm(b.t)] = b.t;
    var short = norm(b.t.split(":")[0]);
    if(!(short in index)) index[short] = b.t;
  });
  var read = 0, rated = 0, added = 0;
  rows.slice(1).forEach(function(r){
    if(!r[iT]) return;
    if(iS > -1 && r[iS] && r[iS].trim() !== "read") return;
    read++;
    var stars = iR > -1 ? Number(r[iR]) : 0;
    if(stars && stars < 4) return;
    if(stars >= 4) rated++;
    var raw = r[iT];
    var hit = index[norm(raw)] || index[norm(raw.split(":")[0])];
    if(hit && addLiked(hit)) added++;
  });
  likedNote = added
    ? "Matched " + added + " of the " + read + " books you have read. Only books already on this shelf can teach it anything."
    : "None of the " + read + " books you have read are on this shelf, so nothing changed.";
  drawLiked(); render();
}
document.getElementById("csvIn").addEventListener("change", function(e){
  var f = e.target.files && e.target.files[0];
  if(!f) return;
  var fr = new FileReader();
  fr.onload = function(){ importGoodreads(String(fr.result)); };
  fr.onerror = function(){ likedNote = "That file could not be read."; drawLiked(); };
  fr.readAsText(f);
  e.target.value = "";
});

readUrl();
loadLiked();
build();
drawLiked();
render();
</script>
</body>
