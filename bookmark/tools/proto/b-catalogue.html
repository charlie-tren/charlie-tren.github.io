<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>B</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wood:#6b4f36;--paper:#e6e1d3;--card:#fbf9f1;--ink:#23201a;--soft:#726a58;
      --line:#cdc5ae;--stamp:#8c2f2f}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Hanken Grotesk',sans-serif;font-size:15px}
.wrap{max-width:900px;margin:0 auto;padding:26px 30px}
.bar{display:flex;justify-content:space-between;align-items:baseline}
.brand{font-family:Spectral,serif;font-size:20px;font-weight:600}
.home{font-size:14px;color:var(--soft);text-decoration:none}
.lede{font-family:Spectral,serif;font-size:17px;color:var(--soft);margin:24px 0 26px;max-width:44ch}
.drawer{background:var(--card);border:1px solid var(--line);border-top:14px solid var(--wood);
  padding:34px 40px 30px;position:relative;box-shadow:0 20px 40px -32px rgba(60,40,20,.7)}
.hole{position:absolute;left:50%;bottom:14px;width:26px;height:26px;margin-left:-13px;
  border:1px solid var(--line);border-radius:50%;background:var(--paper)}
.tabs{display:flex;gap:6px;margin-bottom:-1px}
.tab{background:var(--card);border:1px solid var(--line);border-bottom:none;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);padding:7px 13px}
.tab.on{background:var(--wood);color:#f4efe2;border-color:var(--wood)}
.callno{font-family:'Courier New',monospace;font-size:13px;letter-spacing:.06em;color:var(--soft)}
.title{font-family:Spectral,serif;font-size:32px;font-weight:500;margin:14px 0 4px;letter-spacing:-.01em}
.author{font-family:'Courier New',monospace;font-size:14px;color:var(--soft);margin-bottom:22px}
.ruled{border-top:1px solid var(--line);padding:16px 0;font-family:Spectral,serif;
  font-size:19px;line-height:1.5;max-width:48ch}
.subj{font-family:'Courier New',monospace;font-size:12px;letter-spacing:.05em;color:var(--soft);
  border-top:1px solid var(--line);padding-top:14px}
.stamp{display:inline-block;border:2px solid var(--stamp);color:var(--stamp);
  font-family:'Courier New',monospace;font-size:12px;letter-spacing:.16em;padding:6px 12px;
  transform:rotate(-4deg);margin-top:20px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}
.b1{background:var(--wood);color:#f4efe2;text-decoration:none;font-size:14px;font-weight:600;padding:10px 16px;border-radius:2px}
.b2{border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14px;padding:10px 15px;border-radius:2px}
</style></head><body>
<div class="wrap">
  <div class="bar"><span class="brand">Bookmark.</span><a class="home" href="#">Other projects</a></div>
  <p class="lede">Seven questions about what you want from a book. A new recommendation on the first of each month.</p>
  <div class="tabs"><span class="tab on">September</span><span class="tab">Your answers</span><span class="tab">The shelf</span></div>
  <div class="drawer">
    <div class="callno" id="cn"></div>
    <div class="title" id="ti"></div>
    <div class="author" id="au"></div>
    <div class="ruled" id="wy"></div>
    <div class="subj" id="su"></div>
    <div class="stamp">DUE 1 OCT 2026</div>
    <div class="acts"><a class="b1" href="#">Buy it</a><a class="b2" href="#">Booktopia</a><a class="b2" href="#">Find a library copy</a></div>
    <div class="hole"></div>
  </div>
</div>
<script src="../../books.js"></script>
<script>
var b = window.SHELF.find(function(x){ return x.t==="Trust"; });
document.getElementById("cn").textContent = "MARKETS / FIC / " + b.y;
document.getElementById("ti").textContent = b.t;
document.getElementById("au").textContent = b.a;
document.getElementById("wy").textContent = b.why;
document.getElementById("su").textContent = "SUBJECTS   MONEY AND MARKETS . HISTORY . LITERARY FICTION";
</script>
</body></html>
