<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>D</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#1a1916;--ink:#efe9dc;--soft:#9a9384;--line:#33302a;--accent:#d9a441}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Hanken Grotesk',sans-serif;font-size:15px}
.wrap{max-width:900px;margin:0 auto;padding:26px 30px}
.bar{display:flex;justify-content:space-between;align-items:baseline}
.brand{font-family:Spectral,serif;font-size:20px;font-weight:600}
.home{font-size:14px;color:var(--soft);text-decoration:none}
.lede{font-family:Spectral,serif;font-size:16px;color:var(--soft);margin:22px 0 30px;max-width:46ch}
.shelf{display:flex;align-items:flex-end;gap:5px;height:230px;
  border-bottom:9px solid #4a3career;padding-bottom:0}
.shelf{border-bottom:9px solid #4b3a28}
.spine{width:34px;border-radius:2px 2px 0 0;display:flex;align-items:center;justify-content:center;
  color:#efe9dc;font-family:Spectral,serif;font-size:13px;letter-spacing:.02em;
  writing-mode:vertical-rl;transform:rotate(180deg);padding:14px 0;overflow:hidden;
  border:1px solid rgba(0,0,0,.35);white-space:nowrap}
.spine.out{outline:2px solid var(--accent);outline-offset:2px}
.pulled{display:grid;grid-template-columns:150px 1fr;gap:28px;margin-top:34px;align-items:start}
.cover{height:220px;border-radius:2px 5px 5px 2px;border-left:9px solid rgba(0,0,0,.4);
  display:flex;flex-direction:column;justify-content:space-between;padding:16px 14px;
  font-family:Spectral,serif;color:#f6f1e4;box-shadow:0 20px 40px -26px #000}
.cover .ct{font-size:18px;line-height:1.15;font-weight:600}
.cover .ca{font-size:12px;opacity:.85}
.month{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
.title{font-family:Spectral,serif;font-size:36px;font-weight:500;letter-spacing:-.02em;margin:12px 0 4px}
.author{color:var(--soft);margin-bottom:18px}
.why{font-family:Spectral,serif;font-size:18px;line-height:1.55;max-width:46ch;margin:0 0 24px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.b1{background:var(--accent);color:#211d16;text-decoration:none;font-size:14px;font-weight:600;padding:10px 16px;border-radius:7px}
.b2{border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14px;padding:10px 15px;border-radius:7px}
.cap{margin-top:16px;font-size:13px;color:var(--soft)}
</style></head><body>
<div class="wrap">
  <div class="bar"><span class="brand">Bookmark.</span><a class="home" href="#">Other projects</a></div>
  <p class="lede">Seven questions about what you want from a book. One comes off the shelf on the first of each month.</p>
  <div class="shelf" id="shelf"></div>
  <div class="pulled">
    <div class="cover" id="cov"><div class="ct" id="ct"></div><div class="ca" id="ca"></div></div>
    <div>
      <div class="month">September 2026</div>
      <div class="title" id="ti"></div>
      <div class="author" id="au"></div>
      <p class="why" id="wy"></p>
      <div class="acts"><a class="b1" href="#">Buy it</a><a class="b2" href="#">Booktopia</a><a class="b2" href="#">Find a library copy</a></div>
    </div>
  </div>
</div>
<script src="../../books.js"></script>
<script>
var COLS = ["#2f4858","#7a2e2e","#3d5a45","#6b4f36","#44405e","#7d5b2b","#2b4d4d","#5d3a4a"];
var pool = window.SHELF.filter(function(b){ return b.tags.indexOf("markets")>-1 && b.f==="fic" || b.tags.indexOf("markets")>-1; }).slice(0,16);
var shelf = document.getElementById("shelf");
pool.forEach(function(b,i){
  var s = document.createElement("div");
  s.className = "spine" + (i===4 ? " out" : "");
  s.style.background = COLS[i % COLS.length];
  s.style.height = (150 + (b.t.length % 5) * 16) + "px";
  s.textContent = b.t;
  shelf.appendChild(s);
});
var b = pool[4];
document.getElementById("cov").style.background = COLS[4 % COLS.length];
document.getElementById("ct").textContent = b.t;
document.getElementById("ca").textContent = b.a;
document.getElementById("ti").textContent = b.t;
document.getElementById("au").textContent = b.a + ", " + b.y;
document.getElementById("wy").textContent = b.why;
</script>
</body></html>
