<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>A</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#efece3;--ink:#1c1a16;--soft:#6e6759;--line:#d8d2c2;--jacket:#1f4638;--jink:#f2ede0}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Hanken Grotesk',sans-serif;font-size:15px}
.wrap{max-width:900px;margin:0 auto;padding:26px 30px}
.bar{display:flex;justify-content:space-between;align-items:baseline}
.brand{font-family:Spectral,serif;font-size:20px;font-weight:600}
.home{font-size:14px;color:var(--soft);text-decoration:none}
.lede{font-family:Spectral,serif;font-size:17px;color:var(--soft);margin:24px 0 26px;max-width:44ch}
.row{display:grid;grid-template-columns:300px 1fr;gap:36px;align-items:start}
.jacket{background:var(--jacket);color:var(--jink);border-radius:2px 6px 6px 2px;
  padding:30px 24px 24px;min-height:420px;display:flex;flex-direction:column;
  border-left:12px solid rgba(0,0,0,.32);
  box-shadow:0 26px 50px -30px rgba(20,30,25,.8)}
.jtitle{font-family:Spectral,serif;font-size:33px;line-height:1.08;font-weight:600;letter-spacing:-.02em}
.jrule{height:1px;background:rgba(242,237,224,.35);margin:18px 0}
.jauthor{font-family:Spectral,serif;font-size:17px;letter-spacing:.02em}
.jfoot{margin-top:auto;font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.flap .month{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft)}
.flap h1{font-family:Spectral,serif;font-size:15px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;margin:16px 0 14px;color:var(--soft)}
.flap .why{font-family:Spectral,serif;font-size:20px;line-height:1.5;margin:0 0 22px;max-width:40ch}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:26px}
.chip{font-size:12px;color:var(--soft);border:1px solid var(--line);border-radius:0;padding:4px 10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.b1{background:var(--jacket);color:var(--jink);text-decoration:none;font-size:14px;font-weight:600;padding:10px 16px}
.b2{border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14px;padding:10px 15px}
</style></head><body>
<div class="wrap">
  <div class="bar"><span class="brand">Bookmark.</span><a class="home" href="#">Other projects</a></div>
  <p class="lede">Seven questions about what you want from a book. A new recommendation on the first of each month.</p>
  <div class="row">
    <div class="jacket">
      <div class="jtitle" id="jt"></div>
      <div class="jrule"></div>
      <div class="jauthor" id="ja"></div>
      <div class="jfoot" id="jf"></div>
    </div>
    <div class="flap">
      <div class="month" id="mo"></div>
      <h1>From the flap</h1>
      <p class="why" id="wy"></p>
      <div class="chips" id="ch"></div>
      <div class="acts"><a class="b1" href="#">Buy it</a><a class="b2" href="#">Booktopia</a><a class="b2" href="#">Find a library copy</a></div>
    </div>
  </div>
</div>
<script src="../../books.js"></script>
<script>
var b = window.SHELF.find(function(x){ return x.t==="Trust"; });
document.getElementById("jt").textContent = b.t;
document.getElementById("ja").textContent = b.a;
document.getElementById("jf").textContent = "Bookmark / September";
document.getElementById("mo").textContent = "September 2026";
document.getElementById("wy").textContent = b.why;
["Teaches you something","Nonfiction","Money and markets"].forEach(function(c){
  var e=document.createElement("span"); e.className="chip"; e.textContent=c;
  document.getElementById("ch").appendChild(e); });
</script>
</body></html>
